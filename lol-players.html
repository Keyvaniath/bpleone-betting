<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LoL Players · EdgeStat — quantitative sports-betting analytics: model edges, calibrated probabilities, and an honest settled track record across MLB, NBA, NHL, golf, tennis, soccer and more. Informational only, 21+.">
<link rel="canonical" href="https://betting.bpleone.com/lol-players.html">
<meta name="theme-color" content="#0d1017">
<meta property="og:type" content="website">
<meta property="og:site_name" content="EdgeStat">
<meta property="og:title" content="LoL Players | EdgeStat">
<meta property="og:description" content="LoL Players · EdgeStat — quantitative sports-betting analytics: model edges, calibrated probabilities, and an honest settled track record across MLB, NBA, NHL, golf, tennis, soccer and more. Informational only, 21+.">
<meta property="og:url" content="https://betting.bpleone.com/lol-players.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="LoL Players | EdgeStat">
<meta name="twitter:description" content="LoL Players · EdgeStat — quantitative sports-betting analytics: model edges, calibrated probabilities, and an honest settled track record across MLB, NBA, NHL, golf, tennis, soccer and more. Informational only, 21+.">
<title>LoL Players | EdgeStat</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .player-card { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor:pointer; transition: background 0.15s; }
  .player-card:hover { background: rgba(180,80,220,0.05); }
  .player-card.expanded { background: rgba(180,80,220,0.06); border-left: 3px solid #b450dc; }
  .role-pill { display:inline-block; padding:2px 7px; border-radius:4px; font-size:9px; font-weight:700; text-transform:uppercase; }
  .role-pill.top { background:#4a90c8; color:#fff; }
  .role-pill.jungle { background:#58c878; color:#fff; }
  .role-pill.mid { background:#b450dc; color:#fff; }
  .role-pill.bottom { background:#e35a5a; color:#fff; }
  .role-pill.support { background:#d4a04a; color:#fff; }
  .elite-pill { display:inline-block; padding:2px 7px; border-radius:4px; font-size:9px; font-weight:700; background:linear-gradient(90deg, #b450dc, #d4a04a); color:#fff; }
  .stat-block { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-top:10px; font-size:12px; }
  .prop-row { display:grid; grid-template-columns: 80px 80px 80px 80px 90px; gap:6px; padding:6px 0; font-family:'JetBrains Mono',monospace; font-size:11px; border-bottom:1px dashed rgba(255,255,255,0.04); }
  .filter-bar { display:flex; gap:8px; padding:8px 16px; flex-wrap:wrap; }
  .filter-pill { display:inline-block; padding:5px 12px; border-radius:14px; background:rgba(255,255,255,0.06); cursor:pointer; font-size:11px; }
  .filter-pill.active { background:#b450dc; color:#fff; }
</style>
<script src="js/nav.js"></script>
</head>
<body class="page-lol-players">
<header class="topbar">
  <div class="brand">
    <a href="index.html" class="logo"><span class="logo-mark">⟁</span><span class="logo-text">Edge<span class="accent">Stat</span></span></a>
    <span class="tagline">by bpleone</span>
  </div>
  <nav class="mainnav"><!-- nav.js injects here --></nav>
  <div class="topbar-actions"><div class="ticker">LIVE</div></div>
</header>

<main class="container">

  <section class="page-head">
    <h1>League of Legends — Player Projections</h1>
    <p id="lolPlayersStatus" class="muted">Loading 982-player roster with per-game projections + prop fair odds…</p>
  </section>

  <section class="metric-strip">
    <div class="metric"><span class="metric-num" id="m_players">--</span><span class="metric-label">Players</span></div>
    <div class="metric"><span class="metric-num" id="m_elite">--</span><span class="metric-label">Elite</span></div>
    <div class="metric"><span class="metric-num" id="m_leagues">--</span><span class="metric-label">Leagues</span></div>
    <div class="metric"><span class="metric-num" id="m_roles">5</span><span class="metric-label">Roles</span></div>
  </section>

  <section class="card" style="margin-bottom: 24px;">
    <div class="card-head"><span>🎮 Filter by</span></div>
    <div class="filter-bar" id="filterBar">
      <span class="filter-pill active" data-filter="all">All</span>
      <span class="filter-pill" data-filter="elite">Elite Only</span>
      <span class="filter-pill" data-league="LCK">LCK</span>
      <span class="filter-pill" data-league="LPL">LPL</span>
      <span class="filter-pill" data-league="LEC">LEC</span>
      <span class="filter-pill" data-league="LCS">LCS</span>
      <span class="filter-pill" data-role="top">Top</span>
      <span class="filter-pill" data-role="jungle">Jungle</span>
      <span class="filter-pill" data-role="mid">Mid</span>
      <span class="filter-pill" data-role="bottom">ADC</span>
      <span class="filter-pill" data-role="support">Support</span>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><span>📊 Roster (click for projections)</span><span class="muted" id="rosterMeta">--</span></div>
    <div id="rosterList"><p class="muted" style="padding:14px;">Loading…</p></div>
  </section>

</main>

<script src="js/nav_badge.js"></script>
<script>
let allProjections = [];
let currentFilters = { elite: false, league: null, role: null };

const fmtAmer = (a) => a == null ? "—" : (a >= 0 ? "+" + a : String(a));

function renderRoster() {
  let filtered = allProjections;
  if (currentFilters.elite) filtered = filtered.filter(p => p.is_elite);
  if (currentFilters.league) filtered = filtered.filter(p => p.league === currentFilters.league);
  if (currentFilters.role) filtered = filtered.filter(p => p.role === currentFilters.role);

  document.getElementById("rosterMeta").textContent = `${filtered.length} players shown`;
  if (!filtered.length) {
    document.getElementById("rosterList").innerHTML = `<p class="muted" style="padding:14px;">No players match filters.</p>`;
    return;
  }

  document.getElementById("rosterList").innerHTML = filtered.slice(0, 100).map((p, i) => {
    const proj = p.projection;
    const expandedId = `proj_${i}`;
    return `<div class="player-card" data-pid="${p.id}" onclick="this.classList.toggle('expanded'); document.getElementById('${expandedId}').style.display = this.classList.contains('expanded') ? 'block' : 'none';">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <span style="font-size:14px; font-weight:700; margin-right:8px;">${p.summoner_name}</span>
          <span class="muted" style="font-size:11px;">${p.real_name || ''}</span>
          ${p.is_elite ? '<span class="elite-pill" style="margin-left:6px;">ELITE</span>' : ''}
        </div>
        <div>
          <span class="role-pill ${p.role}">${p.role}</span>
          <span style="margin-left:6px; font-size:11px; color:#888;">[${p.team_code}] · ${p.league}</span>
        </div>
      </div>
      <div class="stat-block">
        <div><span class="muted" style="font-size:10px;">Mean K/G:</span> <strong>${proj.mean_kills}</strong></div>
        <div><span class="muted" style="font-size:10px;">Mean D/G:</span> <strong>${proj.mean_deaths}</strong></div>
        <div><span class="muted" style="font-size:10px;">Mean A/G:</span> <strong>${proj.mean_assists}</strong></div>
        <div><span class="muted" style="font-size:10px;">KDA:</span> <strong style="color:${proj.kda >= 5 ? '#58c878' : 'var(--text-2)'}">${proj.kda}</strong></div>
      </div>
      <div id="${expandedId}" style="display:none; margin-top:12px;">
        <div style="font-size:11px; text-transform:uppercase; color:#b450dc; margin-bottom:8px;">Kill Props</div>
        <div class="prop-row" style="font-weight:700;"><span>Line</span><span>P(over)</span><span>P(under)</span><span>Fair Over</span><span>Fair Under</span></div>
        ${(p.kill_props || []).map(k => `<div class="prop-row">
          <span>OVER ${k.line}</span>
          <span style="color:${k.p_over >= 0.55 ? '#58c878' : '#e35a5a'};">${(k.p_over*100).toFixed(1)}%</span>
          <span>${(k.p_under*100).toFixed(1)}%</span>
          <span>${fmtAmer(k.fair_over_american)}</span>
          <span>${fmtAmer(k.fair_under_american)}</span>
        </div>`).join("")}
        <div style="font-size:11px; text-transform:uppercase; color:#b450dc; margin:12px 0 8px;">Assist Props</div>
        <div class="prop-row" style="font-weight:700;"><span>Line</span><span>P(over)</span><span>P(under)</span><span>Fair Over</span><span>Fair Under</span></div>
        ${(p.assist_props || []).map(a => `<div class="prop-row">
          <span>OVER ${a.line}</span>
          <span style="color:${a.p_over >= 0.55 ? '#58c878' : '#e35a5a'};">${(a.p_over*100).toFixed(1)}%</span>
          <span>${(a.p_under*100).toFixed(1)}%</span>
          <span>${fmtAmer(a.fair_over_american)}</span>
          <span>${fmtAmer(a.fair_under_american)}</span>
        </div>`).join("")}
        <div style="font-size:11px; text-transform:uppercase; color:#b450dc; margin:12px 0 8px;">Death Props</div>
        ${(p.death_props || []).map(d => `<div class="prop-row">
          <span>UNDER ${d.line}</span>
          <span style="color:${d.p_under >= 0.55 ? '#58c878' : '#e35a5a'};">${(d.p_under*100).toFixed(1)}%</span>
          <span></span><span></span>
          <span>${fmtAmer(d.fair_under_american)}</span>
        </div>`).join("")}
        <div style="margin-top:10px; font-size:11px; color:#888;">Skill multiplier: ${p.skill_mult} (compounds league tier + elite prior)</div>
      </div>
    </div>`;
  }).join("");
}

fetch("data/lol_player_props.json?t=" + Date.now(), { cache: "no-cache" })
  .then(r => r.json())
  .then(d => {
    allProjections = d.projections || [];
    document.getElementById("m_players").textContent = d.n_players || 0;
    document.getElementById("m_elite").textContent = d.n_elite || 0;
    document.getElementById("m_leagues").textContent = Object.keys(d.by_league || {}).length;
    document.getElementById("lolPlayersStatus").textContent =
      `${d.n_players} players · ${d.n_elite} elite · refresh: ${(d.generated_at || '').replace('T',' ')}`;
    renderRoster();
  })
  .catch(err => {
    document.getElementById("rosterList").innerHTML = `<p class="muted" style="padding:14px;">Could not load player projections (${err.message}).</p>`;
  });

// Filter handlers
document.getElementById("filterBar").addEventListener("click", e => {
  const t = e.target.closest(".filter-pill");
  if (!t) return;
  if (t.dataset.filter === "all") {
    currentFilters = { elite: false, league: null, role: null };
  } else if (t.dataset.filter === "elite") {
    currentFilters.elite = !currentFilters.elite;
  } else if (t.dataset.league) {
    currentFilters.league = currentFilters.league === t.dataset.league ? null : t.dataset.league;
  } else if (t.dataset.role) {
    currentFilters.role = currentFilters.role === t.dataset.role ? null : t.dataset.role;
  }
  // Update active states
  document.querySelectorAll("#filterBar .filter-pill").forEach(p => {
    const active = (p.dataset.filter === "elite" && currentFilters.elite) ||
                   (p.dataset.league && p.dataset.league === currentFilters.league) ||
                   (p.dataset.role && p.dataset.role === currentFilters.role) ||
                   (p.dataset.filter === "all" && !currentFilters.elite && !currentFilters.league && !currentFilters.role);
    p.classList.toggle("active", !!active);
  });
  renderRoster();
});
</script>

</body>
</html>
