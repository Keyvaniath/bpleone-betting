<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Detail | EdgeStat</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/nav.js"></script>
<style>
  .gh { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:6px; }
  .gh h1 { margin:0; font-size:28px; letter-spacing:-0.5px; }
  .gh .sub { color:var(--muted,#8a93a6); font-family:'JetBrains Mono',monospace; font-size:13px; margin-top:4px; }
  .live-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,60,60,.12); color:#ff5b5b;
                border:1px solid rgba(255,60,60,.35); border-radius:6px; padding:4px 10px; font-family:'JetBrains Mono',monospace;
                font-size:12px; font-weight:600; }
  .live-badge .dot { width:8px;height:8px;border-radius:50%;background:#ff5b5b; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .score { font-family:'JetBrains Mono',monospace; font-size:30px; font-weight:700; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin:18px 0; }
  .card { background:var(--panel,#11151c); border:1px solid var(--border,#222a36); border-radius:10px; padding:16px 18px; }
  .card h3 { margin:0 0 12px; font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted,#8a93a6); }
  .wpbar { height:30px; border-radius:6px; overflow:hidden; display:flex; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; }
  .wpbar .away { background:linear-gradient(90deg,#2f6df6,#3f86ff); color:#fff; display:flex; align-items:center; padding-left:10px; }
  .wpbar .home { background:linear-gradient(90deg,#7a4dff,#9a6bff); color:#fff; display:flex; align-items:center; justify-content:flex-end; padding-right:10px; }
  .ln { display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:13px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .ln:last-child { border-bottom:none; }
  .ln .k { color:var(--muted,#8a93a6); }
  .pos { color:#3ad17e; } .neg { color:#ff5b5b; }
  table.preds { width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:13px; }
  table.preds th { text-align:left; color:var(--muted,#8a93a6); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--border,#222a36); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  table.preds td { padding:7px 8px; border-bottom:1px solid rgba(255,255,255,.04); }
  table.preds tr:hover td { background:rgba(255,255,255,.02); }
  .pill { display:inline-block; padding:1px 7px; border-radius:4px; font-size:10px; text-transform:uppercase; letter-spacing:.4px; }
  .pill.pitcher { background:rgba(122,77,255,.15); color:#b79bff; }
  .pill.batter { background:rgba(47,109,246,.15); color:#7facff; }
  .pill.game { background:rgba(58,209,126,.13); color:#5fe0a0; }
  .rec { display:flex; justify-content:space-between; align-items:center; padding:9px 11px; border-radius:7px; margin-bottom:7px;
         background:rgba(58,209,126,.07); border:1px solid rgba(58,209,126,.22); font-family:'JetBrains Mono',monospace; font-size:13px; }
  .rec .conf { font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted,#8a93a6); }
  .gamepick a { display:flex; justify-content:space-between; padding:13px 16px; border:1px solid var(--border,#222a36); border-radius:9px;
                margin-bottom:9px; text-decoration:none; color:var(--text,#e6e9ef); font-family:'JetBrains Mono',monospace; transition:.12s; }
  .gamepick a:hover { border-color:#3f86ff; background:rgba(63,134,255,.05); }
  .back { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--muted,#8a93a6); text-decoration:none; }
  .back:hover { color:#3f86ff; }
  .muted { color:var(--muted,#8a93a6); }
</style>
</head>
<body class="page-mlb">
<header class="topbar">
  <div class="brand">
    <a href="index.html" class="logo"><span class="logo-mark">⟁</span><span class="logo-text">Edge<span class="accent">Stat</span></span></a>
    <span class="tagline">by bpleone</span>
  </div>
  <nav class="mainnav"><!-- nav.js injects here --></nav>
  <div class="topbar-actions"><div class="ticker" id="liveTicker">GAME</div></div>
</header>

<main class="container">
  <a href="mlb.html" class="back">&larr; MLB slate</a>
  <div id="root" style="margin-top:14px;"><p class="muted">Loading game…</p></div>
</main>

<footer class="site-footer">
  <div class="foot-bot"><span>© 2026 bpleone.com</span><span>Built in SoCal ☀️</span></div>
</footer>

<script>
const Q = new URLSearchParams(location.search);
const TARGET = Q.get("g");        // "AWAY @ HOME"
const root = document.getElementById("root");
const ml = v => (v == null ? "—" : (v > 0 ? "+" + v : "" + v));
const pct = p => (p == null ? "—" : (100 * p).toFixed(1) + "%");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const j = (u) => fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).catch(() => ({}));

let CARDS = {}, REFRESH = null;
const sgn = v => v == null ? "—" : (v >= 0 ? "+" + v : "" + v);

function trendsCard(card) {
  const t = card.trends || {};
  const tf = t.team_form || {}, pf = t.pitcher_form || {}, pen = t.bullpen, hc = t.hot_cold || [], ats = t.ats || {};
  const fa = tf.away, fh = tf.home;
  const statusPill = s => `<span class="pill ${s === "HEATING_UP" ? "game" : s === "COOLING_DOWN" ? "batter" : "pitcher"}">${esc(s || "—")}</span>`;
  const pfLine = p => !p ? '<span class="muted">—</span>' :
    `<b>${esc(p.pitcher || "TBD")}</b> ${statusPill(p.status)} <span class="muted">K/9 ${p.recent_k_per_9_l3 ?? "—"} (${sgn(p.k9_delta)}) · ERA ${p.recent_era_l3 ?? "—"} (${sgn(p.era_delta)})${p.tier && p.tier !== "NEUTRAL_FORM" ? " · " + esc(p.tier) : ""}</span>`;
  const fLine = f => !f ? '<span class="muted">—</span>' :
    `<b>${f.wins}-${f.losses}</b> <span class="muted">${sgn(f.run_diff)} run diff · ${f.runs_pg ?? "—"}/${f.runs_allowed_pg ?? "—"} rpg · ${esc(f.streak || "")}</span>`;
  const atsLine = a => !a ? "" : ` <span class="pill ${a.signal === "MODEL_UNDERRATES" ? "game" : "batter"}">ATS ${esc(a.ats_record)} (${(100 * (a.cover_pct || 0)).toFixed(0)}%)</span>`;
  const penLine = p => !p ? '<span class="muted">—</span>' :
    `<span class="pill ${p.tier === "GASSED" ? "batter" : p.tier === "FRESH" ? "game" : "pitcher"}">${esc(p.tier || "")}</span> <span class="muted">${p.pen_ip_3d ?? 0} IP last 3d${p.closer_used_yesterday ? " · closer used" : ""}</span>`;
  const h2 = card.h2h || {}, ss = h2.season_series || {}, cs = h2.current_series, rm = h2.recent_meetings || [];
  const h2hHtml = `<div class="ln" style="margin-top:12px;border-top:1px solid rgba(255,255,255,.07);padding-top:10px;">
      <span class="k">Season series</span>
      <span>${ss.n ? `<b>${esc(ss.away)} ${ss.away_wins}-${ss.home_wins} ${esc(ss.home)}</b> <span class="muted">(${ss.n} mtg)</span>` : '<span class="muted">first meeting (recent window)</span>'}${cs && cs.series_number ? ` <span class="muted">· game ${esc(cs.series_number)} of series</span>` : ""}</span></div>
    ${rm.length ? `<div class="muted" style="font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:5px;">Recent: ${rm.map(m => `${esc(m.away)} ${m.away_score}-${m.home_score} ${esc(m.home)} <span style="opacity:.6">${esc((m.date || "").slice(5))}</span>`).join(" · ")}</div>` : ""}`;

  const hcRows = hc.length ? hc.map(p =>
    `<tr><td><span class="pill ${p.kind === "hot" ? "game" : "batter"}">${p.kind === "hot" ? "🔥 HOT" : "🧊 COLD"}</span></td>
      <td>${esc(p.name)} <span class="muted">${esc(p.team)}</span></td>
      <td><b>${p.recent_ops != null ? (+p.recent_ops).toFixed(3) : "—"}</b> <span class="muted">L7 OPS</span></td>
      <td class="muted">season ${p.season_ops ? (+p.season_ops).toFixed(3) : "—"}</td></tr>`).join("") : "";

  return `<div class="card" style="margin-top:16px;">
    <h3>Trends</h3>
    <div class="grid2" style="margin:0;">
      <div>
        <div class="ln"><span class="k">${esc(card.away)} form (L10)</span><span>${fLine(fa)}${atsLine(ats.away)}</span></div>
        <div class="ln"><span class="k">${esc(card.home)} form (L10)</span><span>${fLine(fh)}${atsLine(ats.home)}</span></div>
        <div class="ln"><span class="k">${esc(card.away)} starter</span><span>${pfLine(pf.away)}</span></div>
        <div class="ln"><span class="k">${esc(card.home)} starter</span><span>${pfLine(pf.home)}</span></div>
      </div>
      <div>
        <div class="ln"><span class="k">${esc(card.away)} bullpen</span><span>${penLine(pen && pen.away_pen)}</span></div>
        <div class="ln"><span class="k">${esc(card.home)} bullpen</span><span>${penLine(pen && pen.home_pen)}</span></div>
        ${(pen && pen.leans && pen.leans.length) ? `<div class="ln"><span class="k">Bullpen lean</span><span class="pos">${pen.leans.map(esc).join(", ")}</span></div>` : ""}
      </div>
    </div>
    ${h2hHtml}
    ${hc.length ? `<h3 style="margin-top:16px;">Hot &amp; cold bats in this game</h3>
      <table class="preds"><tbody>${hcRows}</tbody></table>` : ""}
  </div>`;
}

function gamePicker(cards) {
  root.innerHTML = `<h1 style="margin:6px 0 4px;">MLB — today's games</h1>
    <p class="muted" style="font-family:'JetBrains Mono',monospace;font-size:13px;">Click a game to see the model line, the plays, and every prediction.</p>
    <div class="gamepick" style="margin-top:16px;">` +
    cards.map(c => {
      const m = c.model || {};
      const fav = (m.p_home_win || 0) >= 0.5 ? c.home : c.away;
      return `<a href="game.html?g=${encodeURIComponent(c.matchup)}">
        <span><b>${esc(c.away)}</b> @ <b>${esc(c.home)}</b><span class="muted">  ${esc(c.time || "")}</span></span>
        <span class="muted">${c.n_predictions} preds · lean ${esc(fav)} ${m.p_home_win != null ? "(" + pct(Math.max(m.p_home_win, 1 - m.p_home_win)) + ")" : ""}</span>
      </a>`;
    }).join("") + `</div>`;
}

function render(card, live) {
  const m = card.model || {}, mk = card.market || {}, w = card.weather || {};
  // live win-prob (from the in-game poller) overrides the pre-game model line.
  const livePH = (live && live.p_home_win != null) ? live.p_home_win : null;
  const pHome = livePH != null ? livePH : m.p_home_win;
  const pAway = pHome != null ? 1 - pHome : (m.p_away_win != null ? m.p_away_win : null);
  // live overlay
  let liveHtml = "", isLive = false, score = "";
  if (live && live.matchup) {
    isLive = true;
    score = `${esc(card.away)} ${live.away_score ?? 0} — ${live.home_score ?? 0} ${esc(card.home)}`;
    const st = live.inning_state || live.state || live.status || "";
    liveHtml = `<div class="live-badge"><span class="dot"></span>LIVE ${esc(st)}</div>`;
  }
  // model line rows
  const lm = card.line_movement || {};
  const lmHtml = lm.edge_vs_market_pp != null ? `
        <div class="ln"><span class="k">Model vs market</span><span>${lm.model_home_implied}% vs ${(lm.market||{}).home_implied}% <span class="${lm.edge_vs_market_pp>=0?'pos':'neg'}">(${lm.edge_vs_market_pp>=0?'+':''}${lm.edge_vs_market_pp}pp ${esc(card.home)})</span></span></div>
        ${lm.has_timeseries ? `<div class="ln"><span class="k">Line drift open&rarr;now</span><span>${lm.ml_drift_pp>=0?'+':''}${lm.ml_drift_pp}pp${lm.steam?' <span class="pos">⚡ STEAM</span>':''}${lm.vs_model?` · market ${esc(lm.vs_model.replace(/_/g," "))}`:""}</span></div>` : `<div class="ln"><span class="k">Line drift</span><span class="muted">live odds feed off — open→now drift n/a</span></div>`}` : "";
  const edge = (mdl, market) => (mdl != null && market != null) ? ml(market) : "—";
  const recs = (card.recommendations || []);
  const preds = (card.predictions || []);
  const famOrder = { pitcher: 0, batter: 1, game: 2 };
  preds.sort((a, b) => (famOrder[a.family] - famOrder[b.family]) || (b.prob - a.prob));

  root.innerHTML = `
  <div class="gh">
    <div>
      <h1>${esc(card.away)} <span class="muted">@</span> ${esc(card.home)}</h1>
      <div class="sub">${esc(card.time || "")} · ${esc(card.park || "")}${w.temp_f ? " · " + w.temp_f + "°F" : ""}${w.is_indoor ? " · dome" : (w.wind_mph != null ? " · wind " + w.wind_mph + "mph" : "")}</div>
      ${isLive ? `<div class="score" style="margin-top:8px;">${score}</div>` : ""}
    </div>
    <div style="text-align:right;">${liveHtml}
      <div class="sub" style="margin-top:6px;">
        ${esc((card.pitchers?.away?.name) || "TBD")} (${esc(card.pitchers?.away?.hand || "?")}) vs ${esc((card.pitchers?.home?.name) || "TBD")} (${esc(card.pitchers?.home?.hand || "?")})
      </div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>${isLive ? "Live win probability" : "Model win probability"}</h3>
      <div class="wpbar">
        <div class="away" style="width:${((pAway || 0.5) * 100).toFixed(0)}%">${esc(card.away)} ${pct(pAway)}</div>
        <div class="home" style="width:${((pHome || 0.5) * 100).toFixed(0)}%">${pct(pHome)} ${esc(card.home)}</div>
      </div>
      <div style="margin-top:14px;">
        <div class="ln"><span class="k">Fair moneyline</span><span>${esc(card.away)} ${ml(m.fair_away_ml)} / ${esc(card.home)} ${ml(m.fair_home_ml)}</span></div>
        <div class="ln"><span class="k">Market (${esc(mk.book || "book")})</span><span>${ml(mk.away_ml)} / ${ml(mk.home_ml)}</span></div>
        <div class="ln"><span class="k">Fair total</span><span>${m.fair_total ?? "—"}${mk.total != null ? `  <span class="muted">(mkt ${mk.total})</span>` : ""}</span></div>
        <div class="ln"><span class="k">Model P(over)</span><span>${pct(m.p_over_market)}</span></div>
        ${lmHtml}
      </div>
    </div>

    <div class="card">
      <h3>The plays ${recs.length ? `· ${recs.length}` : ""}</h3>
      ${recs.length ? recs.map(r => `
        <div class="rec">
          <span><b>${esc(r.label)}</b> <span class="muted">${ml(r.market_price)}</span></span>
          <span>
            <span class="${(r.edge_pct || 0) >= 0 ? "pos" : "neg"}">${r.edge_pct != null ? (r.edge_pct >= 0 ? "+" : "") + r.edge_pct + "% edge" : ""}</span>
            ${r.kelly_units != null ? `<span class="muted"> · ${(+r.kelly_units).toFixed(2)}u</span>` : ""}
            <span class="conf"> · ${esc(r.confidence || "")}</span>
          </span>
        </div>`).join("") : `<p class="muted" style="font-family:'JetBrains Mono',monospace;font-size:13px;">No standalone game-line edge — see prop predictions below.</p>`}
    </div>
  </div>

  ${trendsCard(card)}

  <div class="card">
    <h3>Predictions ${preds.length ? `· ${preds.length}` : ""}</h3>
    ${preds.length ? `<table class="preds"><thead><tr><th>Type</th><th>Subject</th><th>Market</th><th>Model prob</th><th>Fair odds</th></tr></thead><tbody>` +
      preds.map(p => `<tr>
        <td><span class="pill ${p.family}">${esc(p.stat || p.family)}</span></td>
        <td>${esc(p.subject)}</td>
        <td>${esc(p.market)}</td>
        <td><b>${pct(p.prob)}</b></td>
        <td>${ml(p.fair_odds)}</td>
      </tr>`).join("") + `</tbody></table>`
      : `<p class="muted" style="font-family:'JetBrains Mono',monospace;font-size:13px;">Player props populate once lineups post (usually a few hours before first pitch).</p>`}
  </div>

  <p class="muted" style="font-family:'JetBrains Mono',monospace;font-size:11px;margin-top:14px;">
    Fair odds are the model's price (what you'd bet); market is Bovada. ${isLive ? "Live win-prob refreshes every 30s." : "Win-prob updates live once the game starts."}
  </p>`;
}

async function liveFor(card) {
  // overlay live score/state if this game is in progress. live_state.json keys
  // games by FULL team name (Seattle Mariners) with home_runs/away_runs + state.
  const state = await j("data/live_state.json");
  const games = state.games || state.games_in_progress || [];
  const eq = (a, b) => a && b && String(a).toLowerCase() === String(b).toLowerCase();
  const hit = (Array.isArray(games) ? games : []).find(g =>
    (eq(g.home, card.home_full) && eq(g.away, card.away_full)) ||
    (eq(g.home, card.home) && eq(g.away, card.away)));  // fallback if poller emits abbrevs
  if (!hit) return null;
  const st = hit.state || {};
  return {
    matchup: card.matchup,
    home_score: hit.home_runs, away_score: hit.away_runs,
    inning_state: [st.inning_state, st.inning].filter(v => v != null && v !== "").join(" "),
    p_home_win: hit.p_home_win, last_play: hit.last_play,
  };
}

async function load() {
  const data = await j("data/mlb_game_cards.json");
  const cards = data.games || [];
  CARDS = Object.fromEntries(cards.map(c => [c.matchup, c]));
  if (!TARGET || !CARDS[TARGET]) { gamePicker(cards); return; }
  const card = CARDS[TARGET];
  const live = await liveFor(card);
  render(card, live);
  if (live) {  // game is live -> keep it ticking
    clearInterval(REFRESH);
    REFRESH = setInterval(async () => { render(CARDS[TARGET], await liveFor(CARDS[TARGET])); }, 30000);
  }
}
load();
</script>
</body>
</html>
