<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sport Coverage | EdgeStat</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/nav.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 26px; margin: 0 0 6px 0; }
  .sub { color: var(--muted, #888); font-size: 13px; margin-bottom: 22px; max-width: 720px; line-height: 1.55; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .stat-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 14px 16px; }
  .stat-label { color: var(--muted, #888); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .stat-value { font-size: 26px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: #58c878; }

  .panel { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 80px 90px 110px 130px 120px; gap: 12px; padding: 13px 16px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .row.head { background: rgba(255,255,255,0.05); color: var(--muted, #888); font-size: 10px; text-transform: uppercase; padding: 9px 16px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .sport-tag { font-weight: 700; }
</style>
</head>
<body>
<nav-bar></nav-bar>
<div class="container">

<h1>Sport Coverage</h1>
<div class="sub">
  Bird's-eye view of all sports tonight: games on schedule, active modules,
  projections produced, strong edges flagged. Sorted by strong edges descending.
</div>

<div class="stats">
  <div class="stat-card"><div class="stat-label">Games Across All Sports</div><div class="stat-value" id="s-games">—</div></div>
  <div class="stat-card"><div class="stat-label">Total Strong Edges</div><div class="stat-value" id="s-strong">—</div></div>
</div>

<div class="panel">
  <div class="row head">
    <div>Sport</div>
    <div class="num">Games</div>
    <div class="num">Modules</div>
    <div class="num">Projections</div>
    <div class="num">Strong Edges</div>
  </div>
  <div id="rows">Loading…</div>
</div>

<div style="margin-top: 14px; font-size: 11px; color: var(--muted,#888);" id="meta">—</div>

</div>

<script>
async function load() {
  let d;
  try {
    const r = await fetch('data/sport_coverage.json?t=' + Date.now());
    d = await r.json();
  } catch (e) {
    document.getElementById('rows').innerHTML = '<div style="padding:24px;color:#888;">Failed to load.</div>';
    return;
  }
  const totals = d.totals || {};
  document.getElementById('s-games').textContent = totals.n_games_all_sports || 0;
  document.getElementById('s-strong').textContent = totals.n_strong_edges_all_sports || 0;
  const sports = d.sports || [];
  const html = sports.map(s => {
    const strongColor = s.n_strong_edges > 0 ? '#58c878' : '#888';
    const gameColor = s.n_games_today > 0 ? '#fff' : '#666';
    return `
      <div class="row">
        <div class="sport-tag">${s.sport}</div>
        <div class="num" style="color:${gameColor};">${s.n_games_today}</div>
        <div class="num">${s.n_modules_active_tonight}/${s.n_prop_modules}</div>
        <div class="num" style="color:var(--muted,#aaa);">${s.n_total_projections}</div>
        <div class="num" style="color:${strongColor};font-weight:700;">${s.n_strong_edges}</div>
      </div>
    `;
  }).join('');
  document.getElementById('rows').innerHTML = html || '<div style="padding:24px;color:#888;">No data</div>';
  document.getElementById('meta').textContent = 'Generated ' + (d.generated_at || '—');
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
