<html lang="en">
<head>

<meta name="twitter:description" content="Top 3 Picks of the Day · EdgeStat — quantitative sports-betting analytics: model edges, calibrated probabilities, and an honest settled track record across MLB, NBA, NHL, golf, tennis, soccer and more. Informational only, 21+.">
<title>Top 3 Picks of the Day | EdgeStat</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/nav.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .container { max-width: 980px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 32px; margin: 0 0 6px 0; }
  .sub { color: var(--muted, #888); font-size: 13px; margin-bottom: 28px; max-width: 720px; line-height: 1.55; }
  .sub strong { color: #d4a04a; }

  .pick-card {
    background: linear-gradient(135deg, rgba(212, 160, 74, 0.08), rgba(212, 160, 74, 0.02));
    border: 1px solid rgba(212, 160, 74, 0.25);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 16px;
    position: relative;
  }
  .pick-card.rank-1 {
    background: linear-gradient(135deg, rgba(212, 160, 74, 0.18), rgba(212, 160, 74, 0.04));
    border-color: rgba(212, 160, 74, 0.50);
  }
  .pick-card.rank-2 { border-color: rgba(192, 192, 192, 0.35); }
  .pick-card.rank-3 { border-color: rgba(205, 127, 50, 0.30); }

  .rank-badge {
    position: absolute;
    top: -10px;
    left: 20px;
    background: #d4a04a;
    color: #1a1a1a;
    font-weight: 700;
    padding: 3px 12px;
    border-radius: 12px;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .rank-badge.rank-2 { background: #c0c0c0; }
  .rank-badge.rank-3 { background: #cd7f32; color: #fff; }

  .pick-tag-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; margin-top: 8px; }
  .tag {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    padding: 3px 9px; border-radius: 4px;
  }
  .tag-whale     { background: #b266ff; color: #fff; }
  .tag-confluence{ background: #58c878; color: #1a1a1a; }
  .tag-batter    { background: #d4a04a; color: #1a1a1a; }
  .tag-pitcher   { background: #5d9bf0; color: #fff; }
  .tag-direction { background: rgba(255,255,255,0.10); color: var(--muted,#aaa); }

  .pick-name { font-size: 26px; font-weight: 700; margin: 4px 0; color: #fff; }
  .pick-matchup { color: var(--muted,#888); font-size: 13px; margin-bottom: 14px; font-family: 'JetBrains Mono', monospace; }
  .pick-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .stat { text-align: left; }
  .stat-label { font-size: 10px; text-transform: uppercase; color: var(--muted, #888); letter-spacing: 1px; }
  .stat-value { font-size: 18px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: #fff; margin-top: 2px; }

  .stamp {
    font-size: 11px; color: var(--muted,#666); font-family: 'JetBrains Mono', monospace;
    margin-top: 28px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06);
  }
</style>
</head>
<body>

<div id="nav-mount"></div>

<div class="container">
  <h1>★ Top 3 Picks of the Day</h1>
  <p class="sub">
    The day's <strong>three highest-conviction</strong> plays — synthesized from
    every prop module, weighted by signal count and category (WHALES 1.5× ·
    CONFLUENCE 1.2× · PoD 1.0×). One-glance daily action shortlist.
  </p>

  <div id="picks-container"></div>

  <div class="stamp" id="stamp"></div>
</div>

<script>
fetch('data/mlb_top_3_picks.json')
  .then(r => r.json())
  .then(d => {
    document.getElementById('stamp').textContent =
      `Generated ${d.generated_at || ''} · ${d.n_candidates_considered || 0} candidates considered`;

    const container = document.getElementById('picks-container');
    container.innerHTML = '';

    (d.top_3_picks || []).forEach((p, i) => {
      const rank = i + 1;
      const tagClass =
        p.category === 'WHALE' ? 'tag-whale' :
        p.category === 'CONFLUENCE' ? 'tag-confluence' :
        p.category === 'BATTER_POD' ? 'tag-batter' :
        p.category === 'PITCHER_POD' ? 'tag-pitcher' : 'tag-direction';
      const direction = p.direction
        ? `<span class="tag tag-direction">${p.direction}</span>` : '';

      container.insertAdjacentHTML('beforeend', `
        <div class="pick-card rank-${rank}">
          <div class="rank-badge rank-${rank}">RANK ${rank}</div>
          <div class="pick-tag-row">
            <span class="tag ${tagClass}">${p.category}</span>
            ${direction}
          </div>
          <div class="pick-name">${p.player || '—'}</div>
          <div class="pick-matchup">${p.matchup || ''}</div>
          <div class="pick-stats">
            <div class="stat">
              <div class="stat-label">Composite Score</div>
              <div class="stat-value">${(p.composite_score || 0).toFixed(2)}</div>
            </div>
            <div class="stat">
              <div class="stat-label">Signals</div>
              <div class="stat-value">${p.n_signals || 0}</div>
            </div>
            <div class="stat">
              <div class="stat-label">Avg Probability</div>
              <div class="stat-value">${p.avg_probability != null ? (p.avg_probability*100).toFixed(0) + '%' : '—'}</div>
            </div>
          </div>
        </div>
      `);
    });

    if ((d.top_3_picks || []).length === 0) {
      container.innerHTML = '<div style="color:var(--muted,#888);font-size:14px;padding:24px;text-align:center;">No high-conviction picks identified tonight.</div>';
    }
  })
  .catch(e => {
    document.getElementById('picks-container').innerHTML =
      `<div style="color:#d44a4a;font-family:JetBrains Mono;font-size:13px;">Failed to load: ${e}</div>`;
  });
</script>

</body>
</html>
