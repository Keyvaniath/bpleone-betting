<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tonight's Bet Slate | EdgeStat</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/nav.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 4px 0; }
  .sub { color: var(--muted, #888); font-size: 13px; margin-bottom: 24px; max-width: 720px; line-height: 1.55; }

  .bankroll-bar {
    display: flex; gap: 16px; align-items: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 20px;
  }
  .bankroll-bar label { color: var(--muted, #888); font-size: 12px; }
  .bankroll-bar input {
    background: rgba(0,0,0,0.30);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 6px 10px;
    border-radius: 4px;
    width: 110px;
  }
  .bankroll-bar .total {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
  }
  .bankroll-bar .total .label { color: var(--muted,#888); }
  .bankroll-bar .total .val { color: #58c878; font-weight: 700; font-size: 18px; margin-left: 8px; }

  .bet-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 12px;
  }
  .bet-card.alpha   { border-left: 4px solid #d4a04a; }
  .bet-card.book    { border-left: 4px solid #58c878; }
  .bet-card.pod     { border-left: 4px solid #58c878; }
  .bet-card.parlay  { border-left: 4px solid #588cc8; }

  .bet-head {
    display: flex; gap: 10px; align-items: baseline;
    margin-bottom: 8px;
  }
  .bet-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px;
  }
  .bet-tag.alpha  { background: #d4a04a; color: #1a1a1a; }
  .bet-tag.book   { background: #58c878; color: #1a1a1a; }
  .bet-tag.pod    { background: #58c878; color: #1a1a1a; }
  .bet-tag.parlay { background: #588cc8; color: #1a1a1a; }
  .bet-title { font-weight: 700; font-size: 15px; font-family: 'JetBrains Mono', monospace; }
  .bet-meta { color: var(--muted, #888); font-size: 11px; font-family: 'JetBrains Mono', monospace; margin-left: auto; }

  .bet-detail {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1.2fr;
    gap: 12px;
    margin-top: 8px;
  }
  .detail {
    background: rgba(0,0,0,0.20);
    border-radius: 5px;
    padding: 8px 10px;
  }
  .detail .lbl { color: var(--muted, #888); font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; }
  .detail .val { font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
  .detail .val.stake { color: #d4a04a; font-size: 18px; }
  .detail .val.pos { color: #58c878; }

  .empty { padding: 30px; text-align: center; color: var(--muted, #888); font-style: italic; }
</style>
</head>
<body>
<nav-bar></nav-bar>
<div class="container">

<h1>🎯 Tonight's Bet Slate</h1>
<div class="sub">
  One-page action sheet. The top calibrated edges with recommended stakes
  using <strong style="color:#d4a04a;">¼-Kelly sizing</strong>. Set your
  bankroll below — stake column updates instantly.
</div>

<div class="bankroll-bar">
  <label for="bankroll">Bankroll:</label>
  <span style="font-family:'JetBrains Mono',monospace;">$</span>
  <input id="bankroll" type="number" value="1000" min="0" step="50">
  <span style="font-family:'JetBrains Mono',monospace;">·  <span style="color:var(--muted,#888);font-size:11px;">¼-Kelly fractional</span></span>
  <button id="copyBtn" style="margin-left:auto;background:rgba(88,200,120,0.18);border:1px solid rgba(88,200,120,0.40);color:#58c878;font-family:inherit;font-size:12px;padding:6px 14px;border-radius:5px;cursor:pointer;font-weight:600;">📋 Copy Markdown</button>
  <div class="total">
    <span class="label">Total Suggested:</span>
    <span class="val" id="totalStake">$0</span>
  </div>
</div>

<div id="slate">Loading…</div>

</div>

<script>
function fmtPct(x, d=1) { return x == null ? '—' : (x*100).toFixed(d) + '%'; }
function fmtSigned(x, d=1) { if (x == null) return '—'; const s = x.toFixed(d); return (x>=0?'+':'') + s + '%'; }
function fmtOdds(a) { if (a == null) return '—'; return (a >= 0 ? '+' : '') + a; }
function fmtMoney(n) { return '$' + (n != null ? n.toFixed(2) : '0.00'); }

let SLATE = [];

function recompute() {
  const bank = parseFloat(document.getElementById('bankroll').value) || 0;
  let total = 0;
  SLATE.forEach(s => {
    const kelly = s.kelly || 0;
    // ¼-Kelly stake
    s.stake = Math.max(0, bank * kelly * 0.25);
    total += s.stake;
  });
  document.getElementById('totalStake').textContent = fmtMoney(total);
  render();
}

function render() {
  if (SLATE.length === 0) {
    document.getElementById('slate').innerHTML =
      '<div class="empty">No qualifying picks tonight — model output not yet ready or all picks below confidence threshold.</div>';
    return;
  }
  const html = SLATE.map(s => `
    <div class="bet-card ${s.type}">
      <div class="bet-head">
        <span class="bet-tag ${s.type}">${s.typeLabel}</span>
        <span class="bet-title">${s.title}</span>
        <span class="bet-meta">${s.market || ''}</span>
      </div>
      <div class="bet-detail">
        <div class="detail"><div class="lbl">Cal Prob</div><div class="val">${fmtPct(s.prob)}</div></div>
        <div class="detail"><div class="lbl">Fair Odds</div><div class="val" style="color:#d4a04a;">${fmtOdds(s.odds)}</div></div>
        <div class="detail"><div class="lbl">Edge</div><div class="val pos">${fmtSigned(s.edge)}</div></div>
        <div class="detail"><div class="lbl">Kelly</div><div class="val">${(s.kelly||0).toFixed(3)}</div></div>
        <div class="detail"><div class="lbl">Stake (¼-Kelly)</div><div class="val stake">${fmtMoney(s.stake)}</div></div>
      </div>
    </div>
  `).join('');
  document.getElementById('slate').innerHTML = html;
}

async function loadAll() {
  let d;
  try {
    const r = await fetch('data/bet_slate.json?t=' + Date.now());
    d = await r.json();
  } catch {
    document.getElementById('slate').innerHTML = '<div class="empty">Failed to load bet_slate.json</div>';
    return;
  }

  SLATE = (d.slate || []).map(s => ({
    type: (s.type || '').toLowerCase(),
    typeLabel: s.type_label || s.type,
    title: s.title || '—',
    market: s.market || '',
    prob: s.prob,
    odds: s.fair_american,
    edge: s.edge_pct,
    kelly: s.kelly_fraction || 0,
  }));

  recompute();
}

document.getElementById('bankroll').addEventListener('input', recompute);

// Copy markdown to clipboard
document.getElementById('copyBtn').addEventListener('click', async () => {
  const btn = document.getElementById('copyBtn');
  const original = btn.textContent;
  try {
    const r = await fetch('data/slate_snapshot.json?t=' + Date.now());
    const d = await r.json();
    const md = d.markdown || '';
    if (!md) throw new Error('No markdown');
    await navigator.clipboard.writeText(md);
    btn.textContent = '✓ Copied!';
    btn.style.background = 'rgba(88,200,120,0.40)';
    setTimeout(() => {
      btn.textContent = original;
      btn.style.background = 'rgba(88,200,120,0.18)';
    }, 1800);
  } catch (e) {
    btn.textContent = 'Copy failed';
    setTimeout(() => { btn.textContent = original; }, 1800);
  }
});

loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
</body>
</html>
