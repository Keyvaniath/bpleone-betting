# GitHub Pages build config (2026-11-05, pre-launch audit).
#
# The site used to be published with .nojekyll, which serves EVERY file in
# the repo from the site root: CLAUDE.md (the full engineering handoff),
# X-LAUNCH-KIT.md, TODO_BRANDON.md, python/, the Worker source, tools/, docs/.
# Jekyll is now on, with no front matter anywhere (every page is copied
# verbatim as a static file) and this exclude list. The repo stays public;
# the site URL no longer serves its internals.
#
# Files and folders starting with "_" or "." are excluded by Jekyll already.
exclude:
  - "*.md"
  - "**/*.md"
  - legal/
  - ziVdYByY
  - zitGBumr
  - "*.bat"
  - "*.sh"
  - "*.zip"
  - python/
  - tools/
  - docs/
  - cloudflare-worker/
  - printgates/
  - tests/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules/
  - vendor/

# (2026-11-11) Three Markdown files ARE site content: brief.html and
# daily-summary.html fetch them as text. `include` wins over `exclude` (Jekyll
# 3.10 entry_filter, matched on the basename), and the optional-front-matter
# plugin that GitHub Pages enables by default is switched off so a Markdown
# file without front matter is copied verbatim, not rendered to .html.
# python/tests/test_odds_integrity.py checks every .md a page fetches is here.
include:
  - auto_brief.md
  - daily_summary.md
  - daily_summary_v2.md
optional_front_matter:
  enabled: false
