<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EdgeStat Widget</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: linear-gradient(135deg, #0a0b10 0%, #161821 100%);
         color: #e6e6e6; padding: 14px; min-height: 100vh; }
  .widget { max-width: 480px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .logo { font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
  .logo-mark { color: #d4a04a; }
  .accent { color: #d4a04a; }
  .live-pill { display: inline-block; padding: 3px 9px; background: rgba(88,200,120,0.15); color: #58c878;
               font-size: 10px; font-weight: 700; border-radius: 999px; }
  .live-pill::before { content: "● "; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  .pod-card { background: linear-gradient(135deg, rgba(212,160,74,0.12), rgba(212,160,74,0.03));
              border: 1px solid rgba(212,160,74,0.3); border-radius: 10px; padding: 14px;
              margin-bottom: 12px; }
  .pod-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
               color: #d4a04a; font-weight: 700; }
  .pod-matchup { font-size: 18px; font-weight: 700; margin: 6px 0 2px 0; }
  .pod-pick { font-size: 13px; color: #aaa; }
  .pod-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  .stat { background: rgba(255,255,255,0.04); border-radius: 6px; padding: 8px; text-align: center; }
  .stat-val { font-family: 'Menlo', 'Consolas', monospace; font-size: 16px; font-weight: 700; color: #fff; }
  .stat-lbl { font-size: 9px; text-transform: uppercase; color: #888; margin-top: 2px; }

  .summary { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px;
             margin-bottom: 12px; font-size: 11px; }
  .summary-row { display: flex; justify-content: space-between; padding: 4px 0;
                  border-bottom: 1px solid rgba(255,255,255,0.04); }
  .summary-row:last-child { border-bottom: none; }
  .summary-key { color: #888; }
  .summary-val { color: #e6e6e6; font-family: 'Menlo', 'Consolas', monospace; }
  .green { color: #58c878; }

  .cta { display: block; background: linear-gradient(135deg, #d4a04a, #b8862e);
         color: #0a0a0a; text-align: center; padding: 12px; border-radius: 8px;
         text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.5px;
         transition: opacity 0.2s; }
  .cta:hover { opacity: 0.85; }
  .footer { text-align: center; margin-top: 12px; font-size: 10px; color: #555; }
  .footer a { color: #888; text-decoration: none; }
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <div class="logo"><span class="logo-mark">⟁</span> Edge<span class="accent">Stat</span></div>
    <span class="live-pill">LIVE</span>
  </div>

  <div class="pod-card" id="podCard">
    <div class="pod-label">⛳ Play of the Day</div>
    <div class="pod-matchup" id="podMatchup">Loading…</div>
    <div class="pod-pick" id="podPick"></div>
    <div class="pod-stats">
      <div class="stat"><div class="stat-val" id="podProb">--</div><div class="stat-lbl">Model %</div></div>
      <div class="stat"><div class="stat-val" id="podEdge">--</div><div class="stat-lbl">Edge</div></div>
      <div class="stat"><div class="stat-val" id="podKelly">--</div><div class="stat-lbl">Kelly u</div></div>
    </div>
  </div>

  <div class="summary" id="summary">
    <div class="summary-row"><span class="summary-key">Today's slate</span><span class="summary-val" id="sGames">--</span></div>
    <div class="summary-row"><span class="summary-key">Best Bets surfaced</span><span class="summary-val" id="sBets">--</span></div>
    <div class="summary-row"><span class="summary-key">Model Hit Rate (7d)</span><span class="summary-val green" id="sHit">--</span></div>
    <div class="summary-row"><span class="summary-key">Model Health</span><span class="summary-val" id="sHealth">--</span></div>
  </div>

  <a href="http://betting.bpleone.com" class="cta" target="_top">Open EdgeStat Desk →</a>

  <div class="footer">
    <a href="http://betting.bpleone.com">betting.bpleone.com</a> · Updated 3× daily
  </div>
</div>

<script>
const SITE = "http://betting.bpleone.com";
function loadAll() {
  Promise.all([
    fetch(`${SITE}/data/today.json?t=${Date.now()}`).then(r => r.json()).catch(() => ({})),
    fetch(`${SITE}/data/best_bets.json?t=${Date.now()}`).then(r => r.json()).catch(() => ({})),
    fetch(`${SITE}/data/perf_trend.json?t=${Date.now()}`).then(r => r.json()).catch(() => ({})),
    fetch(`${SITE}/data/model_health.json?t=${Date.now()}`).then(r => r.json()).catch(() => ({})),
  ]).then(([today, bb, perf, mh]) => {
    const pod = today.play_of_day || {};
    document.getElementById("podMatchup").textContent = pod.matchup || "No POD today";
    document.getElementById("podPick").textContent = pod.label
      ? `${pod.label} · ${pod.confidence || "MED"} confidence`
      : "Awaiting slate";
    document.getElementById("podProb").textContent = pod.model_prob != null
      ? Math.round(pod.model_prob * 100) + "%" : "--";
    document.getElementById("podEdge").textContent = pod.edge_pct != null
      ? "+" + pod.edge_pct.toFixed(1) + "%" : "--";
    document.getElementById("podKelly").textContent = pod.kelly_units != null
      ? pod.kelly_units.toFixed(1) + "u" : "--";

    document.getElementById("sGames").textContent = (today.games || []).length || 0;
    document.getElementById("sBets").textContent = bb.n_bets || 0;
    const recent = (perf.by_date || []).slice(-7);
    if (recent.length) {
      const avg = recent.reduce((s, r) => s + (r.hit_rate || 0), 0) / recent.length;
      document.getElementById("sHit").textContent = (avg * 100).toFixed(1) + "%";
    }
    if (mh.total_score) {
      document.getElementById("sHealth").textContent = mh.total_score + "/100 · " + mh.tier;
    }
  });
}
loadAll();
setInterval(loadAll, 60 * 1000);  // refresh every 60s
</script>
</body>
</html>
