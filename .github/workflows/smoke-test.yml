name: Smoke Test

# Fast pre-merge guard. Catches the failure class that froze the slate on
# 2026-06-01 -- an undefined name (player_id) that compiled fine and only
# NameError'd at runtime inside the pipeline -- BEFORE the heavy daily pipeline
# runs. Three offline nets (no secrets/network): syntax compile of every module,
# a pyflakes undefined-name scan, and a real run of the core data-chain.
#
# paths filter: only runs when python CODE changes -- NOT on the constant
# bot data refreshes, so it stays cheap and signal-rich.

on:
  push:
    branches: [main]
    paths:
      - 'python/**.py'
      - '.github/workflows/smoke-test.yml'
      # (2026-11-11) pages and scripts too: an inline-script syntax error
      # (an unescaped apostrophe in alpha-pick.html) reached main unseen
      # because a page-only push never ran this workflow.
      - '*.html'
      - 'js/**.js'
      - 'sw.js'
      - '_config.yml'
      - 'tools/check_inline_js.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps + pyflakes
        run: |
          pip install -r python/requirements.txt
          pip install pyflakes
      # (2026-11-11) every inline <script> on every page and every js/*.js file
      # must parse (parse only, nothing is executed).
      - name: Page scripts parse
        run: node tools/check_inline_js.js .
      - name: Odds-integrity tests
        run: |
          pip install -q pytest
          python -m pytest python/tests -q
      - name: Smoke test (compile + undefined-name scan + run core chain)
        working-directory: python
        run: python smoke_test.py
      # (2026-11-04) the published pick artifacts at this commit must be sportsbook-priced.
      # (2026-11-05) the three surfaces added to the guard on 11/05 are rebuilt
      # first by THIS commit's code (offline, from committed inputs) so a push
      # is judged on what its code produces, not on artifacts the previous code
      # wrote; the daily pipeline then checks the real run.
      - name: Rebuild newly guarded artifacts
        working-directory: python
        run: |
          python cfb_model.py > /dev/null
          python player_pot.py > /dev/null
          python picks_export.py > /dev/null
      - name: Pricing guard (published picks need a real sportsbook quote)
        working-directory: python
        run: python verify_pricing.py
