name: Data Health Alert

# Notices when a feed goes dark. Runs the data-health check every 3 hours and
# opens a (deduplicated) GitHub issue if the freshness canary trips -- i.e. a core
# pipeline artifact hasn't refreshed on schedule, meaning a cron has silently died.
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours, off-peak minute
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run data-health check
        working-directory: python
        run: python data_health.py || true
      - name: Alert if a feed went dark
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let d;
            try { d = JSON.parse(fs.readFileSync('data/data_health.json', 'utf8')); }
            catch (e) { core.warning('no data_health.json: ' + e.message); return; }

            // Alert on the freshness canary (a dead cron) -- the unambiguous signal.
            // Transient upstream count mismatches during live games are intentionally
            // NOT escalated to an issue to avoid alert spam.
            const fresh = (d.checks || []).find(c => c.feed === 'freshness');
            const dark = fresh && fresh.status === 'red';
            const title = '🔴 EdgeStat: pipeline stale — a feed went dark';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = open.data.find(i => i.title === title);

            // RECOVERY CLOSES THE ISSUE (2026-10-22). Issue #45 was opened 7/1 and
            // never closed, so every later trip deduped against it ("Alert already
            // open") and NOTHING was sent -- through a 6-day outage in September and
            // a 30-day one 9/22-10/22. An open alert must mean "dark right now".
            if (!dark) {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                  body: '✅ Recovered at ' + (d.generated_at || '') + ' — all core artifacts fresh. Closing; the next outage opens a new issue.' });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
                core.info('Pipeline recovered — closed #' + existing.number);
              } else {
                core.info('Pipeline fresh (overall ' + d.overall + ') — no alert.');
              }
              return;
            }
            const body = [
              'The data-health freshness monitor tripped at ' + (d.generated_at || '') + '.',
              '',
              'Stale / missing core artifacts:',
              ...(fresh.findings || []).map(f => '- ' + f),
              '',
              'A core pipeline artifact has not refreshed on schedule, which usually means',
              'a GitHub Actions cron (daily-pipeline / heartbeat) has failed silently.',
              '',
              'Check: Actions tab → recent workflow runs · /status.html · the freshness ages above.',
              '',
              '_Auto-generated by health-alert. Close this issue once the pipeline recovers._',
            ].join('\n');

            if (existing) {
              // STILL DARK: re-notify at most once a day (a comment notifies
              // everyone watching the issue) instead of going silent.
              const cs = await github.rest.issues.listComments({ owner, repo, issue_number: existing.number, per_page: 100 });
              const last = cs.data.length ? new Date(cs.data[cs.data.length - 1].created_at) : new Date(existing.created_at);
              if (Date.now() - last.getTime() < 22 * 3600 * 1000) { core.info('Alert open #' + existing.number + ', re-notified <22h ago'); return; }
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number,
                body: ['🔴 Still dark at ' + (d.generated_at || '') + ':', ...(fresh.findings || []).map(f => '- ' + f)].join(String.fromCharCode(10)) });
              core.info('Re-notified on #' + existing.number);
              return;
            }
            const created = await github.rest.issues.create({ owner, repo, title, body });
            core.info('Opened health alert issue #' + created.data.number);
