name: Continuous Heartbeat (5-min self-learning + odds refresh)

# Lightweight workflow that runs every 5 minutes ALL DAY, every day.
# Does ONLY the cheap, high-value cycles:
#   - all_picks_tracker.py: settle anything fresh, log new picks
#   - self_learn_weights.py: recompute calibration weights
#   - reverse_line_movement.py: detect sharp money moves
#   - pipeline_watchdog.py: alarm on stale files
#   - live_alerter.py: push Discord on lock transitions
#
# Why this exists:
#   live-games.yml is heavy (~50s, 40+ steps) and only runs during games.
#   This is the *always-on* heartbeat that keeps self-learning ticking 24/7,
#   even when no games are live.

on:
  schedule:
    # 2026-05-21 PASS 3: bumped from */60 to */180 (8/day).
    # 2026-05-26: Brandon increased budget — back to every 2 hours (12/day).
    # 2026-06-10: moved off the top of the hour. GH silently drops :00
    # scheduled events under load — we measured only 8 of 12 daily fires
    # landing. Off-peak minutes drop far less often; the auto-retrigger
    # watchdog now also re-fires any beat that goes >3h stale.
    - cron: '23 */2 * * *'  # every 2 hours = 12 runs/day, off-peak minute
  workflow_dispatch:

permissions:
  contents: write

# Cancel earlier-running heartbeats so they never pile up
concurrency:
  group: continuous-heartbeat
  cancel-in-progress: true

# Global paid-odds budget: The Odds API monthly quota is thin (free tier).
# 14/day = props(8) + one multi-book snapshot(3) + one pipeline enrich(3);
# extra dispatches gracefully fall back to the FREE ESPN lines. August 2026
# lesson: an unguarded 3-credit call in the 2h heartbeat burned ~36/day.
env:
  ODDS_DAILY_CAP: '14'

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    # 2026-05-28: bumped 4 -> 8. The job was hitting the 4-min wall during the
    # D1-sync network step and getting cancelled BEFORE the final commit step,
    # so every run discarded its refreshed data (data frozen mid-afternoon).
    # Flaky network steps below are now individually bounded + non-fatal, and
    # the commit step runs with if: always(), so refreshed data always lands.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r python/requirements.txt

      # Stamp current model version (git SHA + date) for every pick
      - name: Model version stamp
        working-directory: python
        run: python model_version.py || echo "model_version.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Sync any user-saved model overrides from Cloudflare KV (no-op if Worker not deployed)
      - name: Sync model overrides from Worker KV
        env:
          EDGESTAT_WORKER_URL: ${{ secrets.EDGESTAT_WORKER_URL }}
        working-directory: python
        run: python sync_overrides_from_kv.py || echo "sync_overrides_from_kv.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Fresh WNBA box logs BEFORE settlement -- the grader settles every beat
      # but its inputs only refreshed 2x/day in the pipeline, so in-season WNBA
      # picks sat ungradeable most of the day. Bounded + non-fatal.
      - name: WNBA box logs (grading inputs for the settle below)
        timeout-minutes: 2
        continue-on-error: true
        working-directory: python
        run: |
          python espn_box_logs.py wnba || echo "espn_box_logs.py" >> "$RUNNER_TEMP/failed_steps.txt"
          python espn_box_logs.py nba || echo "espn_box_logs.py" >> "$RUNNER_TEMP/failed_steps.txt"
          python espn_event_results.py soccer || echo "espn_event_results.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # World Cup hub stays live through the day: re-price off fresh finals
      # (standings/elo blend) every beat during the tournament.
      - name: World Cup model refresh (in-tournament)
        timeout-minutes: 3
        continue-on-error: true
        working-directory: python
        run: |
          python worldcup_pipeline.py || echo "worldcup_pipeline.py" >> "$RUNNER_TEMP/failed_steps.txt"
          python worldcup_model.py || echo "worldcup_model.py" >> "$RUNNER_TEMP/failed_steps.txt"
          python worldcup_advancement.py || echo "worldcup_advancement.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Self-learning -- update every 5 min, all day
      - name: All-picks unified ledger (settle + log)
        working-directory: python
        run: python all_picks_tracker.py || echo "all_picks_tracker.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Golf leaderboard + live tracker (was daily-only; a tournament round moves hourly)
        working-directory: python
        run: |
          python golf_pipeline.py || echo "golf_pipeline.py" >> "$RUNNER_TEMP/failed_steps.txt"
          python golf_live_tracker.py || echo "golf_live_tracker.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Recent-picks digest (the site ticker reads this, not the 11MB ledger)
        working-directory: python
        run: python recent_picks.py || echo "recent_picks.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Alpha Pick of the Day track record (settle slip legs off the ledger)
        working-directory: python
        run: python alpha_pod_tracker.py || echo "alpha_pod_tracker.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: World Cup model report card (refresh as picks settle)
        working-directory: python
        run: python worldcup_accuracy.py || echo "worldcup_accuracy.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Learning Integrity audit BEFORE self-learn so guards are fresh
      - name: Learning Integrity audit (Wilson CI + Brier + ECE + guards)
        working-directory: python
        run: python learning_integrity.py || echo "learning_integrity.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Self-learn shrinkage weights (respects integrity guards)
        working-directory: python
        run: python self_learn_weights.py || echo "self_learn_weights.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Strategy-sim replay deck tracks the ledger refresh above so the public
      # equity chart / prove-it strip never lag the settled count intraday.
      - name: Strategy simulator replay deck (intraday refresh)
        working-directory: python
        run: python strategy_sim.py || echo "strategy_sim.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # NBA/WNBA book edges + CLV: snapshot the DraftKings line every beat so the
      # open->close movement (the sharp's metric) actually accrues through the day.
      - name: NBA/WNBA book-edge + CLV snapshot (free ESPN odds)
        timeout-minutes: 2
        continue-on-error: true
        working-directory: python
        run: python nba_book_edges.py || echo "nba_book_edges.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Stat-scale projection report card grows as picks settle through the day.
      - name: Live projection trainer (intraday refresh)
        working-directory: python
        run: python projection_trainer.py || echo "projection_trainer.py" >> "$RUNNER_TEMP/failed_steps.txt"

      - name: Top-5 confluence picker (daily action list)
        working-directory: python
        run: python confluence_top_5.py || echo "confluence_top_5.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # FREE odds refresh (ESPN/DraftKings, no key) -- every heartbeat appends a
      # timestamped snapshot to data/odds_history.json so line-movement / steam and
      # Closing Line Value have real open->close resolution (12 snapshots/day).
      - name: Refresh free ESPN odds + snapshot history
        timeout-minutes: 1
        continue-on-error: true
        working-directory: python
        run: python espn_odds.py || echo "espn_odds.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # CFB edges re-price against the refreshed lines (ratings only change when
      # games finish, so the daily run owns those; this just re-shrinks against
      # the current book). Cheap: no fetching beyond what espn_odds already did.
      - name: CFB model-vs-book edges (re-price vs refreshed lines)
        timeout-minutes: 2
        continue-on-error: true
        working-directory: python
        run: python cfb_model.py || echo "cfb_model.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Line movement / steam from the free odds history (open->current per game)
      - name: Line movement / steam detector (free odds)
        working-directory: python
        run: python line_movement.py || echo "line_movement.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Book-calibrated game win probs track the moving line all day (game.html
      # sub-line). Local-only join of today.json + the espn_odds refresh above.
      - name: Book-calibrated game win probs (intraday refresh)
        working-directory: python
        run: python game_calibrated_probs.py || echo "game_calibrated_probs.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # CLV resolves off the LAST pre-game snapshot -- refreshing intraday means
      # the close is the actual close, not yesterday evening's line.
      - name: CLV tracker (open->close on the fresh snapshot)
        working-directory: python
        run: python clv_tracker.py || echo "clv_tracker.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Situational anomaly rollup (steam / compound bullpen / pen mismatch / ump)
      # re-aggregates off the fresh odds snapshot so steam alerts surface intraday.
      - name: Anomaly detector (situational rollup refresh)
        working-directory: python
        run: python anomaly_detector.py || echo "anomaly_detector.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Sharp-money detection -- detect line moves continuously
      - name: Reverse Line Movement detector
        working-directory: python
        run: python reverse_line_movement.py || echo "reverse_line_movement.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Multi-book line shopping (Bovada + ESPN + Odds API if key set)
      - name: Multi-book line aggregator
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: python
        run: python multi_book_lines.py || true

      # D1 sync -- push picks history to Cloudflare D1 (Pro plan)
      # Bounded + non-fatal: this network step hangs when the Worker/D1 is
      # unreachable and was eating the whole job budget before the commit ran.
      - name: D1 sync (Cloudflare Pro -- pick history to edge SQL)
        timeout-minutes: 1
        continue-on-error: true
        env:
          EDGESTAT_WORKER_URL: ${{ secrets.EDGESTAT_WORKER_URL }}
        working-directory: python
        run: python d1_sync.py || true

      # POD P&L (idempotent)
      - name: POD P&L tracker
        working-directory: python
        run: python pod_pl_tracker.py || echo "pod_pl_tracker.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Lock status -- live game progress
      - name: Live locks status tracker
        working-directory: python
        run: python live_locks_status.py || echo "live_locks_status.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Data source verification -- ping all external APIs, prove they're live
      # Bounded + non-fatal: pings several external APIs and can hang/slow on a
      # dead endpoint; must not be able to starve the commit step below.
      - name: Data source verification (real-time API health)
        timeout-minutes: 1
        continue-on-error: true
        working-directory: python
        run: python data_source_verification.py || echo "data_source_verification.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Watchdog freshness alarm
      - name: Pipeline freshness watchdog
        working-directory: python
        run: python pipeline_watchdog.py || echo "pipeline_watchdog.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Discord push on lock transitions + sharp steam
      - name: Live alerter (Discord push)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        working-directory: python
        run: python live_alerter.py || true

      # "The Tape" -- aggregate the strongest active signals (steam / RLM / fresh
      # edges / WC / hoops) into one value-ranked feed. Runs LATE so every source
      # it reads (line_movement, reverse_line_movement, todays_top_plays, worldcup,
      # nba_book_edges) has already refreshed this beat.
      - name: Signal tape aggregator (alerts feed)
        working-directory: python
        run: python alerts_feed.py || echo "alerts_feed.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Calibration status snapshot
      - name: Calibration status snapshot
        working-directory: python
        run: python calibration_status.py || echo "calibration_status.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Model health score
      - name: Model health score (always-on)
        working-directory: python
        run: python model_health.py || echo "model_health.py" >> "$RUNNER_TEMP/failed_steps.txt"

      - name: Site directory live-status refresh
        working-directory: python
        run: python site_directory.py || echo "site_directory.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # if: always() -- commit refreshed data even if an earlier best-effort
      # step failed or was bounded out (only the overall job timeout can skip it).
      - name: Commit if changed
        if: always()
        env:
          GIT_EDITOR: "true"
          GIT_SEQUENCE_EDITOR: "true"
        run: |
          git config user.name  "edgestat-bot"
          git config user.email "actions@github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Heartbeat: no state changes."
          else
            git commit -m "heartbeat: $(date -u +%FT%TZ) (self-learn + RLM + watchdog)"
            for i in 1 2 3; do
              git fetch origin main
              if git merge-base --is-ancestor origin/main HEAD; then
                git push && { echo "pushed cleanly"; exit 0; }
                sleep 3; continue
              fi
              if git rebase --autostash origin/main; then
                git push && { echo "pushed after rebase"; exit 0; }
              else
                git checkout --ours . 2>/dev/null || true
                git add -A
                # GUARD: a partial 'checkout --ours' can leave conflict markers in some
                # files; 'git add -A' would stage them and 'rebase --continue' would COMMIT
                # them, corrupting data/*.json on main. Never commit markers -- abort + retry.
                if git diff --cached -U0 | grep -qE '^\+(<<<<<<<|=======|>>>>>>>)'; then
                  git rebase --abort; sleep 5; continue
                fi
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 5; continue; }
                git push && { echo "pushed after conflict resolution"; exit 0; }
              fi
              sleep 5
            done
            echo "push failed after 3 retries"
          fi

      # FAILURE GATE (2026-10-22). Every step above records its failure and lets
      # the run CONTINUE -- one crashing display print in golf_region_props.py
      # skipped 234 of 324 steps for 30 days (9/22-10/22) while the commit step
      # still ran, so the site looked alive with the ledger build, Alpha record,
      # NFL props/DFS and CFB ratings all frozen. Now everything runs and
      # commits, and THIS step turns the run red and names what failed, so a
      # broken module is visible the same day without darkening the rest.
      - name: Failure gate (red run if any module failed)
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/failed_steps.txt" ]; then
            echo "::error::$(wc -l < "$RUNNER_TEMP/failed_steps.txt") module(s) failed this run:"
            sort -u "$RUNNER_TEMP/failed_steps.txt" | sed 's/^/  - /'
            exit 1
          fi
          echo "all modules ran clean"
