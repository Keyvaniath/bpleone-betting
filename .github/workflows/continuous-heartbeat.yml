name: Continuous Heartbeat (5-min self-learning + odds refresh)

# Lightweight workflow that runs every 5 minutes ALL DAY, every day.
# Does ONLY the cheap, high-value cycles:
#   - all_picks_tracker.py: settle anything fresh, log new picks
#   - self_learn_weights.py: recompute calibration weights
#   - reverse_line_movement.py: detect sharp money moves
#   - pipeline_watchdog.py: alarm on stale files
#   - live_alerter.py: push Discord on lock transitions
#
# Why this exists:
#   live-games.yml is heavy (~50s, 40+ steps) and only runs during games.
#   This is the *always-on* heartbeat that keeps self-learning ticking 24/7,
#   even when no games are live.

on:
  schedule:
    # 2026-05-21 PASS 3: bumped from */60 to */180. Each run ~57s, 24/day was
    # still ~23 min/day. Now 8/day = ~8 min/day. Daily-pipeline already does
    # the same calibration work 2x/day so heartbeat is mostly redundant.
    - cron: '0 */3 * * *'  # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

# Cancel earlier-running heartbeats so they never pile up
concurrency:
  group: continuous-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r python/requirements.txt

      # Stamp current model version (git SHA + date) for every pick
      - name: Model version stamp
        working-directory: python
        run: python model_version.py

      # Sync any user-saved model overrides from Cloudflare KV (no-op if Worker not deployed)
      - name: Sync model overrides from Worker KV
        env:
          EDGESTAT_WORKER_URL: ${{ secrets.EDGESTAT_WORKER_URL }}
        working-directory: python
        run: python sync_overrides_from_kv.py || true

      # Self-learning -- update every 5 min, all day
      - name: All-picks unified ledger (settle + log)
        working-directory: python
        run: python all_picks_tracker.py

      # Learning Integrity audit BEFORE self-learn so guards are fresh
      - name: Learning Integrity audit (Wilson CI + Brier + ECE + guards)
        working-directory: python
        run: python learning_integrity.py

      - name: Self-learn shrinkage weights (respects integrity guards)
        working-directory: python
        run: python self_learn_weights.py

      - name: Top-5 confluence picker (daily action list)
        working-directory: python
        run: python confluence_top_5.py || true

      # Sharp-money detection -- detect line moves continuously
      - name: Reverse Line Movement detector
        working-directory: python
        run: python reverse_line_movement.py || true

      # Multi-book line shopping (Bovada + ESPN + Odds API if key set)
      - name: Multi-book line aggregator
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: python
        run: python multi_book_lines.py || true

      # D1 sync -- push picks history to Cloudflare D1 (Pro plan)
      - name: D1 sync (Cloudflare Pro -- pick history to edge SQL)
        env:
          EDGESTAT_WORKER_URL: ${{ secrets.EDGESTAT_WORKER_URL }}
        working-directory: python
        run: python d1_sync.py || true

      # POD P&L (idempotent)
      - name: POD P&L tracker
        working-directory: python
        run: python pod_pl_tracker.py

      # Lock status -- live game progress
      - name: Live locks status tracker
        working-directory: python
        run: python live_locks_status.py || true

      # Data source verification -- ping all external APIs, prove they're live
      - name: Data source verification (real-time API health)
        working-directory: python
        run: python data_source_verification.py

      # Watchdog freshness alarm
      - name: Pipeline freshness watchdog
        working-directory: python
        run: python pipeline_watchdog.py

      # Discord push on lock transitions + sharp steam
      - name: Live alerter (Discord push)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        working-directory: python
        run: python live_alerter.py || true

      # Calibration status snapshot
      - name: Calibration status snapshot
        working-directory: python
        run: python calibration_status.py || true

      # Model health score
      - name: Model health score (always-on)
        working-directory: python
        run: python model_health.py || true

      - name: Commit if changed
        env:
          GIT_EDITOR: "true"
          GIT_SEQUENCE_EDITOR: "true"
        run: |
          git config user.name  "edgestat-bot"
          git config user.email "actions@github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Heartbeat: no state changes."
          else
            git commit -m "heartbeat: $(date -u +%FT%TZ) (self-learn + RLM + watchdog)"
            for i in 1 2 3; do
              git fetch origin main
              if git merge-base --is-ancestor origin/main HEAD; then
                git push && { echo "pushed cleanly"; exit 0; }
                sleep 3; continue
              fi
              if git rebase origin/main; then
                git push && { echo "pushed after rebase"; exit 0; }
              else
                git checkout --ours . 2>/dev/null || true
                git add -A
                GIT_EDITOR=true git rebase --continue || git rebase --abort
                git push && { echo "pushed after conflict resolution"; exit 0; }
              fi
              sleep 5
            done
            echo "push failed after 3 retries"
          fi
