name: Live In-Progress Games Poll

# Runs every 10 min across the full MLB game window (16:00 - 06:00 UTC =
# 12 PM ET first-pitch through 2 AM ET West Coast night games) to refresh
# live win-expectancy for games in progress.
# Cheap operation: ~1 second per game, no Odds API quota cost.
# Earlier window catches Sunday/Saturday day games starting at 12:15 PM ET.

on:
  schedule:
    - cron: '*/10 16-23 * * *'   # every 10 min 12 PM - 7 PM ET window
    - cron: '*/10 0-6 * * *'     # every 10 min 8 PM - 2 AM ET window
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r python/requirements.txt

      - name: Poll live games (gumbo + win expectancy)
        working-directory: python
        run: python live_games.py

      - name: Live game momentum tracker (poll-over-poll P(home) swings)
        working-directory: python
        run: python live_momentum.py

      - name: Poll live CLV (Bovada line drift per game)
        working-directory: python
        run: python live_clv.py

      - name: Compute live edges (model p_win vs book live ML)
        working-directory: python
        run: python live_edges.py

      # Live data accuracy audit -- compares local artifacts to MLB/ESPN APIs
      # every cycle, surfaces feed degradation immediately.
      - name: Data health check (live cross-verification)
        working-directory: python
        run: python data_health.py

      # Live prop tracker: pulls every DK/PP prop's current in-game stat
      # line + status (WIN, LOSS, CASHING, SWEATING, LIVE, PRE).
      # Frontend auto-refreshes every 60s so Brandon can see in real time
      # which OVERs are cashing and which UNDERs are sweating.
      - name: Track live prop status (DK + PrizePicks)
        working-directory: python
        run: python live_props.py

      # Lineup churn watcher: detects scratches between cron cycles, flags
      # affected DK/PP props as STALE on /props + /pickem banners.
      - name: Detect lineup churn since last poll
        working-directory: python
        run: python lineup_churn.py

      # Live K-pace alerts: each SP's K count vs prop line, ON PACE FOR
      # OVER / BEHIND PACE / EARLY HOOK. Pulls live box scores.
      - name: K-pace + bullpen warming alerts
        working-directory: python
        run: python k_pace_alerts.py

      # Scratch + in-game removal alerts: fires Discord webhook the moment
      # a player with open props is scratched pre-game or removed mid-game.
      # State persisted in .scratch_alerted.json to avoid double-firing.
      - name: Scratch / removal alerter (Discord ping)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        working-directory: python
        run: python scratch_alerts.py

      # Auto-detect "locked" props (already crossed the line + player done).
      - name: Lock detector
        working-directory: python
        run: python lock_detector.py

      # Bullpen warming + save-opportunity detector from MLB feed.
      - name: Bullpen warming watcher
        working-directory: python
        run: python bullpen_warming.py

      # Injury news scanner: MLB transactions feed, alerts on slate players.
      - name: Injury news scanner (Discord ping)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        working-directory: python
        run: python injury_news.py

      # Live-total drift: score-aware recompute of fair total vs market.
      - name: Live total drift
        working-directory: python
        run: python live_total_drift.py

      # Steam radar: multi-cycle line-move trajectory tracking.
      - name: Steam-move radar
        working-directory: python
        run: python steam_detector.py

      # Auto-rebalance: if a scratched player held an auto-portfolio slot,
      # promote the next-rank candidate. Output: data/rebalance_events.json.
      - name: Auto-rebalance portfolio
        working-directory: python
        run: python auto_rebalance.py

      # NBA live scoreboard refresh (free ESPN; will catch in-game score updates)
      - name: NBA live scoreboard
        working-directory: python
        run: python nba_pipeline.py

      # NHL live scoreboard refresh
      - name: NHL live scoreboard
        working-directory: python
        run: python nhl_pipeline.py

      # KBO + LoL + CS live refresh (cheap polls, no rate limits)
      - name: KBO live scoreboard
        working-directory: python
        run: python kbo_pipeline.py
      - name: KBO Poisson re-run
        working-directory: python
        run: python kbo_model.py
      - name: LoL Riot esports refresh
        working-directory: python
        run: python lol_pipeline.py
      - name: LoL ELO re-run (settles completed matches)
        working-directory: python
        run: python lol_model.py
      - name: CS state refresh
        working-directory: python
        run: python cs_pipeline.py
      - name: CS ELO re-run
        working-directory: python
        run: python cs_model.py

      # Esports + KBO live alerts (Discord ping on lead change / POT flip)
      - name: Esports + KBO live alerts (Discord)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        working-directory: python
        run: python esports_alerts.py

      - name: Commit if state changed
        env:
          GIT_EDITOR: "true"
          GIT_SEQUENCE_EDITOR: "true"
        run: |
          git config user.name  "edgestat-bot"
          git config user.email "actions@github.com"
          # Add all data/ changes (no per-file checks; tolerates missing files)
          git add -A data/
          if git diff --cached --quiet; then
            echo "No live games or no state changes."
          else
            git commit -m "live: poll $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git fetch origin main
              if git merge-base --is-ancestor origin/main HEAD; then
                git push && { echo "pushed cleanly"; exit 0; }
                sleep 3; continue
              fi
              if git rebase origin/main; then
                git push && { echo "pushed after rebase"; exit 0; }
              else
                git checkout --ours . 2>/dev/null || true
                git add -A
                GIT_EDITOR=true git rebase --continue || git rebase --abort
                git push && { echo "pushed after conflict resolution"; exit 0; }
              fi
              sleep 5
            done
            echo "push failed after 3 retries"
          fi

      - name: Notify on live-poll failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"content\": \"⚠️ EdgeStat live-poll failed at $(date -u +%FT%TZ). Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi
