name: Daily MLB Pipeline

# Runs every morning at 6:00 ET (10:00 UTC), again at 1:00 ET (line refresh),
# and again at 6:00 PM ET. Pulls live odds + schedule, runs the model, commits
# the refreshed data/*.json back to main. The site reads what's in main.

on:
  schedule:
    - cron: '0 10 * * *'   # 6 AM ET
    - cron: '0 17 * * *'   # 1 PM ET (line refresh)
    - cron: '0 22 * * *'   # 6 PM ET (final pre-game refresh)
  workflow_dispatch:        # manual trigger button

# Needed for git push (default GITHUB_TOKEN is read-only otherwise).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r python/requirements.txt

      # Smoke tests: every module imports + critical data shapes valid +
      # Bovada reachable + calibration shrinkage works. Fast (<10s).
      # Fails the pipeline early on obvious breakage rather than letting
      # garbage propagate to today.json.
      - name: Smoke tests
        working-directory: python
        run: python smoke_tests.py

      # Snapshot the active config (defaults + any runtime overrides) so
      # /config.html can render the live knob table.
      - name: Snapshot config
        working-directory: python
        run: python config.py dump

      # Diff data/runtime_config.json against the last seen snapshot. Any
      # change since prior cron (override added / removed / changed) is
      # appended to data/config_history.json for the audit trail.
      - name: Log config override changes
        working-directory: python
        run: python config_history.py

      # Settle yesterday's projections BEFORE generating today's, so today's
      # projections incorporate the latest calibration corrections.
      - name: Settle yesterday's outcomes
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python outcomes.py

      - name: Recompute calibration corrections
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python calibration_runner.py

      # Where-is-the-model-wrong analysis: per-market residuals, histograms,
      # per-player systematic patterns. Surfaces /residuals.html.
      - name: Compute residual analysis
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python residuals.py

      # Performance-over-time trend: per-day hit rate, Brier, MAE, ROI.
      # Lets us see if the model is getting better as calibration accumulates.
      - name: Compute performance trend
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python perf_trend.py

      # Anomaly detection: flag player/market pairs the model is structurally
      # wrong on (bias correction can't fix systematic player-level errors).
      - name: Detect player + day anomalies
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python anomalies.py

      # Single-number model confidence score (0-100) + tier label.
      # Aggregates calibration / sample / residual / ROI signals.
      - name: Compute model confidence score
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python model_confidence.py

      # Per-player gamelogs (last 14 games/starts) for the sparkline on
      # the player deep-dive page. Caps at 350 players to respect API quota.
      # NOW enriched with venue + is_home + is_night per game so downstream
      # park / day-night / travel splits work without extra API calls.
      - name: Pull player gamelogs (last 14)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python player_gamelogs.py

      # One-shot enrichment of track_record settled props with HP umpire +
      # venue + day/night tags (where missing). Caps at 500 records per run
      # to be polite to MLB Stats API. Idempotent + safe to repeat.
      - name: Backfill track_record context (ump / venue / night)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python backfill_context.py

      # Per-player deep-dive precompute: aggregates season + career + L/R + H/A
      # splits from MLB Stats API (free), joins with matchups for BvP H2H +
      # pitch-arsenal xwOBA, derives park / day-night / travel / vs-umpire
      # from the enriched gamelog + track_record. Powers /player.html.
      # MUST RUN BEFORE rationales.py so the rationales can fold breakdown
      # signals (hot/cold, park splits, BvP) into each prop's drivers.
      - name: Build player breakdowns (splits + BvP + park + travel + umpire)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python player_breakdown.py

      # Per-prop rationale: "why this play" with model factors, season stats,
      # Statcast metrics, calibration disclaimers + breakdown-enriched
      # drivers (hot/cold, vs-handedness, park, BvP H2H, lineup spot, etc.).
      # Caps at top 300 by edge.
      - name: Generate prop rationales (breakdown-enriched)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python rationales.py

      # Drift detection: compare today's calibration vs yesterday's.
      # Alerts on >5% correction moves or sudden sample-count drops.
      - name: Detect calibration drift
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python drift_detector.py

      # Walk-forward backtest: rolling-window evaluation proving the model
      # IS improving (Brier shrinks day over day with bias correction applied).
      - name: Walk-forward backtest
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python walk_forward.py

      # Per-player bias overrides: bespoke multipliers for players the
      # market-level bias correction can't fix (z >= 2 systematic outliers).
      - name: Compute per-player bias overrides
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python player_bias.py

      # Secondary multiplier tuner: grid-search amplifier on opp_mult,
      # umpire_k_mult, park_hand_mult per market.
      - name: Tune secondary multipliers
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python multiplier_tuner.py

      # Training feedback log: writes a "what changed this run" entry to
      # training_feedback.json so /training renders a feed of recent activity.
      - name: Log training feedback
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python training_feedback.py

      # Parameter recommender: analyzes calibration / walk-forward / track-record
      # and writes data/param_recommendations.json with suggested config knob
      # changes. /config.html renders these with one-click Apply links to
      # runtime_config.json on GitHub. Suggestions only -- never auto-applied.
      - name: Generate parameter recommendations
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python param_recommender.py

      # Override effect tracker: for each entry in config_history.json,
      # compute pre/post 7-day Brier + hit rate from track_record. Lets the
      # operator (and the recommender) see whether each tweak actually
      # improved the model. Surfaces on /config.
      - name: Measure override effects
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python override_effects.py

      # Pipeline health audit: empty/demo/stale-artifact detection.
      # Runs LAST so it captures the final state of every artifact.
      # Surfaces /audit.html.

      - name: Run daily pipeline (real data → today.json + matchups.json + snapshot)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: python
        run: python pipeline.py

      # Player-props refresh. EDGESTAT_PROPS_MAX_GAMES controls the quota cap:
      # set to 16 on the $20 tier (20k req/month), 8 on free tier (500/month).
      - name: Run player-props pipeline (DraftKings)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EDGESTAT_PROPS_MAX_GAMES: ${{ vars.EDGESTAT_PROPS_MAX_GAMES || '16' }}
        working-directory: python
        run: python props_pipeline.py

      # Build parlay suggestions from today's qualifying single-leg edges.
      - name: Run parlay engine
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python parlays.py

      # Correlation-aware Same-Game Parlay (SGP) builder. For each game,
      # finds top-EV 2-4 leg combos using a pairwise correlation matrix
      # (e.g. same-player HR + TB are tightly coupled). Books charge ~25%
      # extra on SGPs assuming legs are independent -- this surfaces the
      # gap. Output: data/sgps.json -> /parlays.html top card.
      - name: Build correlation-aware Same-Game Parlays
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python sgp_builder.py

      # Pitcher fatigue + early-hook risk grade. Powers /mlb panel.
      - name: Grade pitcher fatigue + early-hook risk
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python pitcher_fatigue.py

      # Weather-conditional HR-rate delta + OVER/UNDER lean per game.
      - name: Score weather-conditional HR multiplier
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python weather_conditional.py

      # Pre-game slate confidence (lineup confirms / weather / rookies / hooks).
      # MUST run after pitcher_fatigue + weather_conditional so it sees them.
      - name: Compute pre-game slate confidence
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python slate_confidence.py

      # Lineup churn watcher: diff matchups.json vs prior snapshot.
      # Runs in the live workflow too so churn surfaces between cron cycles.
      - name: Detect lineup churn (post-publish scratches)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python lineup_churn.py

      # Composite Best Bets ranker: rolls up DK + PP + NRFI + SGPs into
      # a single quality-scored list. Runs LAST so it sees the latest
      # of every upstream artifact. Powers /best-bets.html.
      - name: Compose Best Bets digest (composite ranker)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python best_bets.py

      # Bullpen exhaustion -> late-inning OU lean per game.
      - name: Score bullpen workload alerts
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python bullpen_alert.py

      # Risk-adjusted Sharpe ranking of tonight's plays.
      - name: Rank by Sharpe (EV / sigma)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python sharpe_ranking.py

      # Auto-portfolio: optimal multi-bet subset given bankroll + Kelly +
      # slate-confidence-adjusted quality gate + per-game correlation cap.
      - name: Build auto-portfolio
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python portfolio_optimizer.py

      # 10K MC simulator of tonight's portfolio outcomes. Powers /bankroll
      # "Tonight's Portfolio" card with real-money distribution.
      - name: Monte Carlo tonight's portfolio
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python bankroll_simulator.py

      # Line movement / bet-timing: ACT NOW vs WAIT alerts from price
      # diffs cycle-over-cycle. Surfaces on /props.
      - name: Detect line-movement timing signals
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python line_timing.py

      # Per-bet CLV tracker -- proves bets beat the close (sharpness proxy).
      - name: Compute per-bet CLV
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python clv_per_bet.py

      # Day-of-week P&L analysis from settled track_record.
      - name: Day-of-week performance analysis
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python dow_pl.py

      # Hot-streak heatmap for tonight's slate.
      - name: Score hot streaks (cross-slate heatmap)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python hot_streaks.py

      # Cross-book arb / shading detector (DK vs PrizePicks).
      - name: Detect cross-book arb opportunities
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python cross_book_arb.py

      # Pitcher fastball velocity decay flag (injury proxy).
      - name: Flag pitcher velocity decay
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python velocity_decay.py

      # Daily picks CSV export.
      - name: Export picks CSV
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python csv_export.py

      # NBA + NFL stubs (will start producing real data when enabled in config)
      - name: NBA stub artifact (back-compat)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python nba_stub.py

      # === DEEP DATA LAYER FIRST (so sport pipelines pick up fresh calibration shifts) ===
      # Self-training writes self_training_<sport>.json with bias corrections;
      # nba/nhl/wnba/etc pipelines read it via _self_training_shift() and apply
      # the shift to p_home_win. So this must run BEFORE the sport pipelines.
      - name: Pull last-14-days historical games per sport
        working-directory: python
        run: python historical_games.py
      - name: Compute per-team form (L5/L10) per sport
        working-directory: python
        run: python multi_sport_team_form.py
      - name: Compute head-to-head history per sport
        working-directory: python
        run: python head_to_head.py
      - name: Self-training backtest (per-sport bias + calibration shift)
        working-directory: python
        run: python self_train.py

      # NOW run sport pipelines so they apply the freshly-computed calibration shifts
      - name: NBA live scoreboard + win probabilities (post-self-train)
        working-directory: python
        run: python nba_pipeline.py
      - name: NHL live scoreboard + win probabilities (post-self-train)
        working-directory: python
        run: python nhl_pipeline.py
      - name: Pull ESPN team rosters (NBA/WNBA/NHL/NFL) -- 4,618 players
        working-directory: python
        run: python espn_rosters.py
      - name: Pull per-player game logs (last 20 games) for NBA/WNBA/NHL starters
        working-directory: python
        run: python espn_player_stats.py
      - name: Generate REAL player prop projections from per-game averages
        working-directory: python
        run: python real_player_props.py
      - name: Per-team residual analysis (over/underrated)
        working-directory: python
        run: python team_residuals.py
      - name: Player trends L5 vs L20 (heating up / cooling down)
        working-directory: python
        run: python player_trends.py
      - name: Multi-sport portfolio builder (quality-weighted)
        working-directory: python
        run: python multi_sport_portfolio.py
      - name: Drift detector v2 (prob shifts + model degradation)
        working-directory: python
        run: python drift_detector_v2.py
      - name: Cross-sport CLV tracker (morning snapshot + intraday compare)
        working-directory: python
        run: python clv_tracker_multi.py
      - name: Heat/cold alert aggregator (hot teams + trending players)
        working-directory: python
        run: python heat_cold_alerts.py
      - name: Pre-game alert system (form-aligned high conviction picks)
        working-directory: python
        run: python pregame_alerts.py
      - name: MLB batter per-game logs (real prop projections for 372+ hitters)
        working-directory: python
        run: python mlb_batter_logs.py
      - name: MLB batter heat tracker (L14 AVG vs season delta)
        working-directory: python
        run: python mlb_batter_heat.py
      - name: MLB extended player props (TB / BB / SO / HRR / outs / extended K)
        working-directory: python
        run: python mlb_extended_props.py
      - name: NBA player heat tracker (L5 vs season PTS/REB/AST deltas)
        working-directory: python
        run: python nba_player_heat.py
      - name: NBA extended props (DD/TD/PR/PA/RA combos + alt-3PM)
        working-directory: python
        run: python nba_extended_props.py
      - name: NHL extended props (ATG/goals/assists/points/SOG, playoff-filtered)
        working-directory: python
        run: python nhl_extended_props.py
      - name: NHL team props (total goals / BTTS / first period / per-team)
        working-directory: python
        run: python nhl_team_props.py
      - name: Soccer extended team props (EPL/MLS/UCL goals/BTTS/clean-sheet)
        working-directory: python
        run: python soccer_extended_props.py
      - name: Slate-wide player prop aggregator (5K+ sweet-spot picks)
        working-directory: python
        run: python slate_player_pot.py
      - name: Slate-wide TEAM market aggregator (ML/totals/BTTS/specials)
        working-directory: python
        run: python slate_team_pot.py
      - name: Todays Top Plays curated board (>=70% prob, Kelly-ranked)
        working-directory: python
        run: python todays_top_plays.py
      - name: WNBA player heat tracker (L5 vs season -- tight thresholds)
        working-directory: python
        run: python wnba_player_heat.py
      - name: UFC fight matchup engine (career-record ELO + experience)
        working-directory: python
        run: python ufc_matchup.py
      - name: UFC method-of-victory (KO / Sub / Decision + fight-doesn't-go-distance)
        working-directory: python
        run: python ufc_method_of_victory.py
      - name: Golf player heat (recent finish + Sunday-round momentum)
        working-directory: python
        run: python golf_player_heat.py
      - name: Golf region props (Top USA / Europe / Asia / etc.)
        working-directory: python
        run: python golf_region_props.py
      - name: ATS tracker (model cover% per team)
        working-directory: python
        run: python ats_tracker.py
      - name: Multi-sport correlation / regime detector
        working-directory: python
        run: python multi_sport_correlation.py
      - name: Daily prediction log (append + auto-settle from historicals)
        working-directory: python
        run: python daily_prediction_log.py
      - name: Cross-sport anomaly detector (streak / residual / over-pct mismatches)
        working-directory: python
        run: python anomaly_detector.py
      - name: NFL survivor pool helper (in-season picks ranked by tier)
        working-directory: python
        run: python survivor_pool.py
      - name: Daily summary v2 markdown digest (all signals + portfolio + self-training)
        working-directory: python
        run: python daily_summary_v2.py
      - name: MLB starting pitcher game logs (real per-start stats from MLB API)
        working-directory: python
        run: python mlb_pitcher_logs.py
      - name: MLB pitcher matchup engine (K/ER prop projections per game)
        working-directory: python
        run: python mlb_pitcher_matchup.py
      - name: MLB pitcher DEEP matchup (TTO + opp lineup K-rate + form + park stack)
        working-directory: python
        run: python mlb_pitcher_deep_matchup.py
      - name: MLB catcher framing K-add overlay (pitcher prop K-shading)
        working-directory: python
        run: python mlb_catcher_framing.py
      - name: MLB batter-vs-SP matchup edges (xwOBA arsenal + career split adjustments)
        working-directory: python
        run: python mlb_batter_sp_edges.py
      - name: MLB pitcher form regression (recent vs season blend + streak flags)
        working-directory: python
        run: python mlb_pitcher_form_regression.py
      - name: MLB team-total edges (decompose model fair_total -> per-team Poisson lines)
        working-directory: python
        run: python mlb_team_total_edges.py
      - name: MLB run-line edges (Poisson convolution on per-team lambdas)
        working-directory: python
        run: python mlb_run_line_edges.py
      - name: "MLB under alerts (multi-signal under detector: park + weather + pitchers + ump)"
        working-directory: python
        run: python mlb_unders_alerts.py
      - name: MLB starter pitch count + IP projection
        working-directory: python
        run: python mlb_starter_pitch_count.py
      - name: MLB lineup strength + mismatch detector
        working-directory: python
        run: python mlb_lineup_strength.py
      - name: MLB bullpen freshness tracker (compound late-inning alerts)
        working-directory: python
        run: python mlb_bullpen_freshness.py
      - name: NHL playoff goalie matchup (blended SV%, expected goals, team totals + shutout)
        working-directory: python
        run: python nhl_goalie_matchup.py
      - name: NHL skater props (anytime goal, SOG, points, multi-point markets)
        working-directory: python
        run: python nhl_skater_props.py
      - name: RE-RUN slate aggregators (fold in all new sport-specific modules)
        working-directory: python
        run: |
          python slate_player_pot.py
          python slate_team_pot.py
          python todays_top_plays.py
      - name: Play of the Day P&L tracker (PRIMARY accuracy benchmark, 1u flat)
        working-directory: python
        run: python pod_pl_tracker.py
      - name: POD factor decomposition (real per-factor contributions, not seed mock)
        working-directory: python
        run: python pod_factor_decomp.py
      - name: Locks of the Day (record top 5 picks + settle any pending)
        working-directory: python
        run: python locks_of_day.py
      - name: All-picks unified ledger (every surfaced pick -> training signal)
        working-directory: python
        run: python all_picks_tracker.py
      - name: Self-learn shrinkage weights (per-source feedback loop)
        working-directory: python
        run: python self_learn_weights.py
      - name: Cross-sport parlay builder (2-leg + 3-leg combos with same-game correlation)
        working-directory: python
        run: python cross_sport_parlay_builder.py
      - name: Weekly recap (last-7-day locks performance summary)
        working-directory: python
        run: python weekly_recap.py
      - name: Calibration status snapshot (per-source shrinkage transparency)
        working-directory: python
        run: python calibration_status.py
      - name: Tonight's brief (60-second action-only markdown summary)
        working-directory: python
        run: python tonight_brief.py
      - name: Locks CLV tracker (closing line value per lock -- early ROI signal)
        working-directory: python
        run: python locks_clv.py
      - name: Sharp action radar (top-25 pick line movement)
        working-directory: python
        run: python sharp_action_radar.py
      - name: Reverse Line Movement detector (sharp money signal)
        working-directory: python
        run: python reverse_line_movement.py || true
      - name: MLB Total Bases props (1+/2+/3+ TB Poisson projections)
        working-directory: python
        run: python mlb_total_bases_props.py || true
      - name: MLB First-5-Innings market (F5 ML + F5 totals, sharp-favored)
        working-directory: python
        run: python mlb_first5_market.py || true
      - name: MLB Stolen Base props (delivery x pop time x runner speed)
        working-directory: python
        run: python mlb_steal_props.py || true
      - name: NBA pace-adjusted total projections
        working-directory: python
        run: python nba_pace_adjusted.py || true
      - name: MLB starter quality composite (0-100 ranking)
        working-directory: python
        run: python mlb_starter_quality_composite.py || true
      - name: Multi-book line aggregator (Bovada + ESPN + Odds API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: python
        run: python multi_book_lines.py || true
      - name: "Whale picks (max-confluence: top board + consensus + sharp action)"
        working-directory: python
        run: python whale_picks.py
      - name: Pick evolution tracker (stable vs flickering picks across cycles)
        working-directory: python
        run: python pick_evolution_tracker.py
      - name: MLB batter situational splits (home/away + day/night log-odds shifts)
        working-directory: python
        run: python mlb_batter_situational_splits.py
      - name: MLB batter L/R pitcher-handedness splits (season vsL/vsR vs opposing SP hand)
        working-directory: python
        run: python mlb_batter_lvr_splits.py
      - name: MLB pitcher LvR x opposing-lineup handedness (weighted K/9 projection)
        working-directory: python
        run: python mlb_pitcher_lvr_lineup.py
      - name: MLB batter ADVANCED splits (RISP + late-close + day-night + home-away)
        working-directory: python
        run: python mlb_batter_advanced_splits.py || true
      - name: Consensus picks (>=2 independent modules agree on same batter)
        working-directory: python
        run: python consensus_picks.py
