name: Daily MLB Pipeline

# Runs every morning at 6:00 ET (10:00 UTC), again at 1:00 ET (line refresh),
# and again at 6:00 PM ET. Pulls live odds + schedule, runs the model, commits
# the refreshed data/*.json back to main. The site reads what's in main.

on:
  schedule:
    - cron: '0 10 * * *'   # 6 AM ET
    - cron: '0 17 * * *'   # 1 PM ET (line refresh)
    - cron: '0 22 * * *'   # 6 PM ET (final pre-game refresh)
  workflow_dispatch:        # manual trigger button

# Needed for git push (default GITHUB_TOKEN is read-only otherwise).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r python/requirements.txt

      - name: Run daily pipeline (real data → today.json)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: python
        run: python pipeline.py

      - name: Commit + push if data changed
        run: |
          git config user.name  "edgestat-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): daily refresh $(date -u +%FT%TZ)"
            git push
          fi
