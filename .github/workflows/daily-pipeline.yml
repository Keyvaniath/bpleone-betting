name: Daily MLB Pipeline

# Runs every morning at 6:00 ET (10:00 UTC), again at 1:00 ET (line refresh),
# and again at 6:00 PM ET. Pulls live odds + schedule, runs the model, commits
# the refreshed data/*.json back to main. The site reads what's in main.

on:
  schedule:
    - cron: '0 10 * * *'   # 6 AM ET
    - cron: '0 17 * * *'   # 1 PM ET (line refresh)
    - cron: '0 22 * * *'   # 6 PM ET (final pre-game refresh)
  workflow_dispatch:        # manual trigger button

# Needed for git push (default GITHUB_TOKEN is read-only otherwise).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r python/requirements.txt

      # Settle yesterday's projections BEFORE generating today's, so today's
      # projections incorporate the latest calibration corrections.
      - name: Settle yesterday's outcomes
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python outcomes.py

      - name: Recompute calibration corrections
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python calibration_runner.py

      - name: Run daily pipeline (real data → today.json + matchups.json + snapshot)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: python
        run: python pipeline.py

      # Player-props refresh. EDGESTAT_PROPS_MAX_GAMES controls the quota cap:
      # set to 16 on the $20 tier (20k req/month), 8 on free tier (500/month).
      - name: Run player-props pipeline (DraftKings)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EDGESTAT_PROPS_MAX_GAMES: ${{ vars.EDGESTAT_PROPS_MAX_GAMES || '16' }}
        working-directory: python
        run: python props_pipeline.py

      # Build parlay suggestions from today's qualifying single-leg edges.
      - name: Run parlay engine
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python parlays.py

      # Pull PrizePicks daily board, compare to DK, run model at PP's lines.
      - name: Run pick-em (PrizePicks) integration
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python pickem.py

      # Sleeper Picks integration. Stubs out gracefully when SLEEPER_TOKEN is unset.
      - name: Run Sleeper Picks integration (auth-gated)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SLEEPER_TOKEN: ${{ secrets.SLEEPER_TOKEN }}
        working-directory: python
        run: python sleeper.py

      # Daily injury tracker: 40-man roster IL pulls per team.
      - name: Pull IL status (all 30 teams)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python injury_tracker.py

      # CLV computation: compare today's morning snapshot to the latest (near
      # closing) lines. Best run at 6 PM ET, but no harm running every cron.
      - name: Compute Closing Line Value
        working-directory: python
        run: python clv.py

      # Aggregate today's top plays across DraftKings, PrizePicks, and parlays.
      - name: Aggregate Top Plays across all markets
        working-directory: python
        run: python top_plays.py

      # Generate the daily markdown brief from all of today's artifacts.
      - name: Generate daily summary brief
        working-directory: python
        run: python daily_summary.py

      - name: Commit + push if data changed
        run: |
          git config user.name  "edgestat-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): daily refresh $(date -u +%FT%TZ)"
            git push
          fi
