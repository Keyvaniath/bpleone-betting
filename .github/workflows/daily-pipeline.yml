name: Daily MLB Pipeline

# Runs every morning at 6:00 ET (10:00 UTC), again at 1:00 ET (line refresh),
# and again at 6:00 PM ET. Pulls live odds + schedule, runs the model, commits
# the refreshed data/*.json back to main. The site reads what's in main.

on:
  schedule:
    - cron: '0 10 * * *'   # 6 AM ET
    - cron: '0 17 * * *'   # 1 PM ET (line refresh)
    - cron: '0 22 * * *'   # 6 PM ET (final pre-game refresh)
  workflow_dispatch:        # manual trigger button

# Needed for git push (default GITHUB_TOKEN is read-only otherwise).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r python/requirements.txt

      # Smoke tests: every module imports + critical data shapes valid +
      # Bovada reachable + calibration shrinkage works. Fast (<10s).
      # Fails the pipeline early on obvious breakage rather than letting
      # garbage propagate to today.json.
      - name: Smoke tests
        working-directory: python
        run: python smoke_tests.py

      # Settle yesterday's projections BEFORE generating today's, so today's
      # projections incorporate the latest calibration corrections.
      - name: Settle yesterday's outcomes
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python outcomes.py

      - name: Recompute calibration corrections
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python calibration_runner.py

      # Where-is-the-model-wrong analysis: per-market residuals, histograms,
      # per-player systematic patterns. Surfaces /residuals.html.
      - name: Compute residual analysis
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python residuals.py

      # Performance-over-time trend: per-day hit rate, Brier, MAE, ROI.
      # Lets us see if the model is getting better as calibration accumulates.
      - name: Compute performance trend
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python perf_trend.py

      # Anomaly detection: flag player/market pairs the model is structurally
      # wrong on (bias correction can't fix systematic player-level errors).
      - name: Detect player + day anomalies
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python anomalies.py

      # Single-number model confidence score (0-100) + tier label.
      # Aggregates calibration / sample / residual / ROI signals.
      - name: Compute model confidence score
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python model_confidence.py

      # Per-prop rationale: "why this play" with model factors, season stats,
      # Statcast metrics, calibration disclaimers. Caps at top 300 by edge.
      - name: Generate prop rationales
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python rationales.py

      # Per-player gamelogs (last 14 games/starts) for the sparkline on
      # the player deep-dive page. Caps at 350 players to respect API quota.
      # NOW enriched with venue + is_home + is_night per game so downstream
      # park / day-night / travel splits work without extra API calls.
      - name: Pull player gamelogs (last 14)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python player_gamelogs.py

      # One-shot enrichment of track_record settled props with HP umpire +
      # venue + day/night tags (where missing). Caps at 500 records per run
      # to be polite to MLB Stats API. Idempotent + safe to repeat.
      - name: Backfill track_record context (ump / venue / night)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python backfill_context.py

      # Per-player deep-dive precompute: aggregates season + career + L/R + H/A
      # splits from MLB Stats API (free), joins with matchups for BvP H2H +
      # pitch-arsenal xwOBA, derives park / day-night / travel / vs-umpire
      # from the enriched gamelog + track_record. Powers /player.html.
      - name: Build player breakdowns (splits + BvP + park + travel + umpire)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python player_breakdown.py

      # Drift detection: compare today's calibration vs yesterday's.
      # Alerts on >5% correction moves or sudden sample-count drops.
      - name: Detect calibration drift
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python drift_detector.py

      # Walk-forward backtest: rolling-window evaluation proving the model
      # IS improving (Brier shrinks day over day with bias correction applied).
      - name: Walk-forward backtest
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python walk_forward.py

      # Per-player bias overrides: bespoke multipliers for players the
      # market-level bias correction can't fix (z >= 2 systematic outliers).
      - name: Compute per-player bias overrides
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python player_bias.py

      # Secondary multiplier tuner: grid-search amplifier on opp_mult,
      # umpire_k_mult, park_hand_mult per market.
      - name: Tune secondary multipliers
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python multiplier_tuner.py

      # Pipeline health audit: empty/demo/stale-artifact detection.
      # Runs LAST so it captures the final state of every artifact.
      # Surfaces /audit.html.

      - name: Run daily pipeline (real data → today.json + matchups.json + snapshot)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: python
        run: python pipeline.py

      # Player-props refresh. EDGESTAT_PROPS_MAX_GAMES controls the quota cap:
      # set to 16 on the $20 tier (20k req/month), 8 on free tier (500/month).
      - name: Run player-props pipeline (DraftKings)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EDGESTAT_PROPS_MAX_GAMES: ${{ vars.EDGESTAT_PROPS_MAX_GAMES || '16' }}
        working-directory: python
        run: python props_pipeline.py

      # Build parlay suggestions from today's qualifying single-leg edges.
      - name: Run parlay engine
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python parlays.py

      # Pull PrizePicks daily board, compare to DK, run model at PP's lines.
      - name: Run pick-em (PrizePicks) integration
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python pickem.py

      # PrizePicks Power-Play optimizer: build optimal 2-6 leg combinations.
      - name: Optimize PrizePicks Power Plays
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python pickem_optimizer.py

      # Sleeper Picks integration. Stubs out gracefully when SLEEPER_TOKEN is unset.
      - name: Run Sleeper Picks integration (auth-gated)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SLEEPER_TOKEN: ${{ secrets.SLEEPER_TOKEN }}
        working-directory: python
        run: python sleeper.py

      # Daily injury tracker: 40-man roster IL pulls per team.
      - name: Pull IL status (all 30 teams)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python injury_tracker.py

      # Last-10 team form for hot/cold signal overlay.
      - name: Pull team form (last 10 per team)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python team_form.py

      # Bullpen workload: flags teams with gassed relievers (> 8 IP in 2 days).
      # Useful signal for totals (gassed pen -> more late-inning runs likely).
      - name: Pull bullpen workload (last 2 days)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python bullpen.py

      # NRFI / YRFI projections (No Runs First Inning).
      - name: Project NRFI / YRFI per game
        working-directory: python
        run: python nrfi.py

      # First-5 (F5) totals -- isolates starting pitcher edge from bullpen.
      - name: Project First-5 totals per game
        working-directory: python
        run: python first_five.py

      # Lineup quality aggregator: sum each confirmed batter's xwOBA x PA.
      - name: Score confirmed lineup quality
        working-directory: python
        run: python lineup_quality.py

      # Run-line (-1.5 / +1.5) projections via Skellam normal approximation.
      - name: Project run lines
        working-directory: python
        run: python run_line.py

      # Travel + rest day signal per team.
      - name: Compute travel + rest day signal
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python travel.py

      # Pitcher arsenal vs opposing lineup handedness leverage score.
      - name: Score pitcher arsenal vs lineup
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python pitch_matchup.py

      # Series momentum / context (Game 2 of series, blowout reactions, etc).
      - name: Compute series context
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python series_context.py

      # Pythagorean expectation (luck-adjusted record per team).
      - name: Pull Pythagorean expectations
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python pythag.py

      # MLB transactions feed (trades, call-ups, DFAs, IL moves -- last 5 days).
      - name: Pull MLB transactions feed
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python transactions.py

      # Batter recent form (last 14 days hitting per starter in confirmed lineups).
      - name: Pull batter recent form
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python batter_form.py

      # Pitcher days of rest (catches short rest / extra rest situations).
      - name: Compute pitcher days of rest
        working-directory: python
        run: python pitcher_rest.py

      # Research depth score per game (how complete our data stack is).
      - name: Score research depth per game
        working-directory: python
        run: python research_depth.py

      # Best batter-vs-pitcher xwOBA matchups (leverage / fade spots).
      - name: Score best matchups (batter-vs-pitch xwOBA)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python best_matchups.py

      # Model trainer: walk-forward optimization once enough outcomes accumulate.
      - name: Train + tune model parameters
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python model_trainer.py

      # CLV computation: compare today's morning snapshot to the latest (near
      # closing) lines. Best run at 6 PM ET, but no harm running every cron.
      - name: Compute Closing Line Value
        working-directory: python
        run: python clv.py

      # Aggregate today's top plays across DraftKings, PrizePicks, and parlays.
      - name: Aggregate Top Plays across all markets
        working-directory: python
        run: python top_plays.py

      # Generate the daily markdown brief from all of today's artifacts.
      - name: Generate daily summary brief
        working-directory: python
        run: python daily_summary.py

      # Health audit: writes data/pipeline_health.json with per-artifact
      # status (ok/empty/stale/demo). Surfaces on /audit.html.
      - name: Pipeline health audit
        working-directory: python
        run: python pipeline_health.py

      # Push to Discord / Slack if webhook URLs are configured as repo secrets.
      - name: Notify channels (Discord / Slack)
        if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        working-directory: python
        run: python notify.py

      - name: Commit + push if data changed
        run: |
          git config user.name  "edgestat-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): daily refresh $(date -u +%FT%TZ)"
            # Rebase + retry to handle race with live-games workflow.
            for i in 1 2 3; do
              git pull --rebase origin main || { git rebase --abort; sleep 3; continue; }
              git push && exit 0
              sleep 5
            done
            echo "push failed after retries"
            exit 1
          fi
