name: Daily MLB Pipeline

# Runs every morning at 6:00 ET (10:00 UTC) and again at 1:00 ET (slate refresh).
# Pulls live odds, runs the model, writes data/today.json, commits + pushes.
# This is the engine that keeps the front-end fresh.

on:
  schedule:
    - cron: '0 10 * * *'   # 6 AM ET
    - cron: '0 17 * * *'   # 1 PM ET (line refresh)
    - cron: '0 22 * * *'   # 6 PM ET (final refresh)
  workflow_dispatch:        # manual trigger button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r python/requirements.txt

      - name: Fetch live data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          cd python
          python data_fetcher.py

      - name: Run pipeline
        run: |
          cd python
          python pipeline.py

      - name: Commit + push
        run: |
          git config user.name  "edgestat-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore(data): daily refresh $(date -u +%FT%TZ)"
          git push
