      - name: Commit + push if data changed
        # RESILIENCE (added 2026-06-02): run even when an earlier step failed, so a
        # single bad module can never again freeze the slate. On 2026-06-01 a
        # NameError in props_pipeline.py aborted the job BEFORE this step, so a
        # freshly-computed today.json was never published and the site served
        # ~17h-stale data. With always(), whatever fresh data WAS produced still
        # ships; the job still reports failure (so the if:failure alert + the
        # auto-retrigger watchdog still fire) -- we get the signal AND the data.
        if: always()
        env:
          # Headless: never open EDITOR on rebase-continue / commit-edit
          GIT_EDITOR: "true"
          GIT_SEQUENCE_EDITOR: "true"
        run: |
          git config user.name  "edgestat-bot"
          git config user.email "actions@github.com"
          # emails/ too (2026-10-22): alpha_email.py rewrites the TRACKED
          # emails/latest.html, which was never staged -- so it sat stale since
          # 9/08, and the dirty tree made the rebase below refuse ("cannot
          # rebase: You have unstaged changes"), losing the whole run's data
          # whenever main moved mid-run. --autostash covers any other strays.
          git add data/ emails/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): daily refresh $(date -u +%FT%TZ)"
            # Robust retry: if rebase hits conflicts on data/*.json, just take
            # OUR version (we just produced fresh data, ours is newer than remote)
            for i in 1 2 3 4 5; do
              git fetch origin main
              # If our HEAD already includes origin/main, push directly
              if git merge-base --is-ancestor origin/main HEAD; then
                git push && { echo "pushed cleanly"; exit 0; }
                sleep 3
                continue
              fi
              # Attempt rebase; on conflict take our version for any data/*.json
              if git rebase --autostash origin/main; then
                git push && { echo "pushed after rebase"; exit 0; }
              else
                # Conflict path: take ours for everything, then continue with
                # GIT_EDITOR=true so the rebase-continue commit message edit
                # doesn't try to open an interactive editor.
                git checkout --ours . 2>/dev/null || true
                git add -A
                # GUARD: a partial 'checkout --ours' can leave conflict markers in some
                # files; 'git add -A' would stage them and 'rebase --continue' would COMMIT
                # them, corrupting data/*.json on main. Never commit markers -- abort + retry.
                if git diff --cached -U0 | grep -qE '^\+(<<<<<<<|=======|>>>>>>>)'; then
                  git rebase --abort; sleep 5; continue
                fi
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 5; continue; }
                git push && { echo "pushed after conflict resolution"; exit 0; }
              fi
              sleep 5
            done
            echo "push failed after 5 retries"
            exit 1
          fi

      # FAILURE GATE (2026-10-22). Every step above records its failure and lets
      # the run CONTINUE -- one crashing display print in golf_region_props.py
      # skipped 234 of 324 steps for 30 days (9/22-10/22) while the commit step
      # still ran, so the site looked alive with the ledger build, Alpha record,
      # NFL props/DFS and CFB ratings all frozen. Now everything runs and
      # commits, and THIS step turns the run red and names what failed, so a
      # broken module is visible the same day without darkening the rest.
      - name: Failure gate (red run if any module failed)
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/failed_steps.txt" ]; then
            echo "::error::$(wc -l < "$RUNNER_TEMP/failed_steps.txt") module(s) failed this run:"
            sort -u "$RUNNER_TEMP/failed_steps.txt" | sed 's/^/  - /'
            exit 1
          fi
          echo "all modules ran clean"
