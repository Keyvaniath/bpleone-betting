name: Daily MLB Pipeline

# Runs every morning at 6:00 ET (10:00 UTC), again at 1:00 ET (line refresh),
# and again at 6:00 PM ET. Pulls live odds + schedule, runs the model, commits
# the refreshed data/*.json back to main. The site reads what's in main.

on:
  schedule:
    # 2026-05-21: dropped 1 PM ET refresh to fit GH Actions quota.
    # Each run is ~9.5 min and we are at 90% of 2,000 included minutes.
    # 3x/day -> 2x/day saves ~9.5 min/day. Re-enable 1 PM cron after June 1 reset.
    # 2026-06-17: moved the morning run 6 AM ET -> 7 AM PT (14:00 UTC). 3 AM PT
    # was too early (lineups unset); 7 AM PT is the morning slate + the daily
    # Alpha Pick of the Day refresh Brandon reads. Quota-neutral (a move, not an
    # add). 14:00 UTC = 7 AM PDT (summer); = 6 AM PST in winter -- close enough.
    - cron: '0 14 * * *'   # 7 AM PT — morning slate + Alpha Pick of the Day
    - cron: '0 22 * * *'   # 6 PM ET — final pre-game refresh
  workflow_dispatch:        # manual trigger button (use for line-shop refresh)

# Needed for git push (default GITHUB_TOKEN is read-only otherwise).
# Overlapping dispatches QUEUE instead of racing each other to the commit
# step (2026-10-23; the race is also covered by rebase --autostash).
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write       # the daily Alpha email issue (2026-10-23)

# Global paid-odds budget: The Odds API monthly quota is thin (free tier).
# 14/day = props(8) + one multi-book snapshot(3) + one pipeline enrich(3);
# extra dispatches gracefully fall back to the FREE ESPN lines. August 2026
# lesson: an unguarded 3-credit call in the 2h heartbeat burned ~36/day.
env:
  ODDS_DAILY_CAP: '14'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r python/requirements.txt

      # Smoke tests: every module imports + critical data shapes valid +
      # Bovada reachable + calibration shrinkage works. Fast (<10s).
      # Fails the pipeline early on obvious breakage rather than letting
      # garbage propagate to today.json.
      - name: Smoke tests
        working-directory: python
        run: python smoke_tests.py || echo "smoke_tests.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Snapshot the active config (defaults + any runtime overrides) so
      # /config.html can render the live knob table.
      - name: Snapshot config
        working-directory: python
        run: python config.py dump || echo "config.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Diff data/runtime_config.json against the last seen snapshot. Any
      # change since prior cron (override added / removed / changed) is
      # appended to data/config_history.json for the audit trail.
      - name: Log config override changes
        working-directory: python
        run: python config_history.py || echo "config_history.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Settle yesterday's projections BEFORE generating today's, so today's
      # projections incorporate the latest calibration corrections.
      - name: Settle yesterday's outcomes
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python outcomes.py || echo "outcomes.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Recompute calibration corrections
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python calibration_runner.py || echo "calibration_runner.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Where-is-the-model-wrong analysis: per-market residuals, histograms,
      # per-player systematic patterns. Surfaces /residuals.html.
      - name: Compute residual analysis
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python residuals.py || echo "residuals.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Performance-over-time trend: per-day hit rate, Brier, MAE, ROI.
      # Lets us see if the model is getting better as calibration accumulates.
      - name: Compute performance trend
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python perf_trend.py || echo "perf_trend.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Anomaly detection: flag player/market pairs the model is structurally
      # wrong on (bias correction can't fix systematic player-level errors).
      - name: Detect player + day anomalies
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python anomalies.py || echo "anomalies.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Single-number model confidence score (0-100) + tier label.
      # Aggregates calibration / sample / residual / ROI signals.
      - name: Compute model confidence score
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python model_confidence.py || echo "model_confidence.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Per-player gamelogs (last 14 games/starts) for the sparkline on
      # the player deep-dive page. Caps at 350 players to respect API quota.
      # NOW enriched with venue + is_home + is_night per game so downstream
      # park / day-night / travel splits work without extra API calls.
      - name: Pull player gamelogs (last 14)
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python player_gamelogs.py || echo "player_gamelogs.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # One-shot enrichment of track_record settled props with HP umpire +
      # venue + day/night tags (where missing). Caps at 500 records per run
      # to be polite to MLB Stats API. Idempotent + safe to repeat.

      # Per-player deep-dive precompute: aggregates season + career + L/R + H/A
      # splits from MLB Stats API (free), joins with matchups for BvP H2H +
      # pitch-arsenal xwOBA, derives park / day-night / travel / vs-umpire
      # from the enriched gamelog + track_record. Powers /player.html.
      # MUST RUN BEFORE rationales.py so the rationales can fold breakdown
      # signals (hot/cold, park splits, BvP) into each prop's drivers.
      - name: Build player breakdowns (splits + BvP + park + travel + umpire)
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python player_breakdown.py || echo "player_breakdown.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Per-prop rationale: "why this play" with model factors, season stats,
      # Statcast metrics, calibration disclaimers + breakdown-enriched
      # drivers (hot/cold, vs-handedness, park, BvP H2H, lineup spot, etc.).
      # Caps at top 300 by edge.
      - name: Generate prop rationales (breakdown-enriched)
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python rationales.py || echo "rationales.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Drift detection: compare today's calibration vs yesterday's.
      # Alerts on >5% correction moves or sudden sample-count drops.
      - name: Detect calibration drift
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python drift_detector.py || echo "drift_detector.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Walk-forward backtest: rolling-window evaluation proving the model
      # IS improving (Brier shrinks day over day with bias correction applied).

      # Per-player bias overrides: bespoke multipliers for players the
      # market-level bias correction can't fix (z >= 2 systematic outliers).

      # Secondary multiplier tuner: grid-search amplifier on opp_mult,
      # umpire_k_mult, park_hand_mult per market.

      # Training feedback log: writes a "what changed this run" entry to
      # training_feedback.json so /training renders a feed of recent activity.
      - name: Log training feedback
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python training_feedback.py || echo "training_feedback.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Parameter recommender: analyzes calibration / walk-forward / track-record
      # and writes data/param_recommendations.json with suggested config knob
      # changes. /config.html renders these with one-click Apply links to
      # runtime_config.json on GitHub. Suggestions only -- never auto-applied.
      - name: Generate parameter recommendations
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python param_recommender.py || echo "param_recommender.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Override effect tracker: for each entry in config_history.json,
      # compute pre/post 7-day Brier + hit rate from track_record. Lets the
      # operator (and the recommender) see whether each tweak actually
      # improved the model. Surfaces on /config.
      - name: Measure override effects
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python override_effects.py || echo "override_effects.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Pipeline health audit: empty/demo/stale-artifact detection.
      # Runs LAST so it captures the final state of every artifact.
      # Surfaces /audit.html.

      - name: Odds-key preflight (validate ODDS_API_KEY -> data/odds_key_status.json)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: python
        run: python odds_key_preflight.py || echo "odds_key_preflight.py" >> "$RUNNER_TEMP/failed_steps.txt"

      - name: Run daily pipeline (real data → today.json + matchups.json + snapshot)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: python
        run: python pipeline.py || echo "pipeline.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Player-props refresh. EDGESTAT_PROPS_MAX_GAMES controls the quota cap:
      # set to 16 on the $20 tier (20k req/month), 8 on free tier (500/month).
      - name: Run player-props pipeline (DraftKings)
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          EDGESTAT_PROPS_MAX_GAMES: ${{ vars.EDGESTAT_PROPS_MAX_GAMES || '16' }}
          # Optional market override (comma-separated). Set the repo variable to
          # stretch a thin monthly quota; empty = module defaults (4 markets).
          EDGESTAT_PROPS_MARKETS: ${{ vars.EDGESTAT_PROPS_MARKETS || '' }}
        working-directory: python
        run: python props_pipeline.py || echo "props_pipeline.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # MLB DFS: DK Classic salaries (free public lobby) + season-rate mean
      # projections (statsapi, disk-cached) + exact dual-eligibility optimizer.
      # Free-data only -- no paid-quota cost.
      - name: MLB DFS (DK salaries -> projections -> optimal lineup)
        working-directory: python
        run: python mlb_dfs.py || echo "mlb_dfs.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Daily accountability: snapshot/freeze the published optimal, grade
      # yesterday's from real box scores every morning.
      - name: MLB DFS receipts (grade yesterday's published lineup)
        working-directory: python
        run: python mlb_dfs_receipts.py || echo "mlb_dfs_receipts.py" >> "$RUNNER_TEMP/failed_steps.txt"

      # Unify today.json (model line + market + recs) with every per-matchup prop
      # into one card per game -> data/mlb_game_cards.json, powering the clickable
      # per-game detail view (game.html). Runs after props so it can join them.
      - name: Build per-game cards (game.html detail view)
        working-directory: python
        run: python mlb_game_cards.py || echo "mlb_game_cards.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # League-wide Trends hub: ATS under/over-rates, hot/cold teams + bats,
      # pitcher form leaderboard, run-environment -> data/trends_hub.json (trends.html).
      - name: Build league-wide Trends hub
        working-directory: python
        run: python trends_hub.py || echo "trends_hub.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # High-Confidence Board + props-only parlays (read the joined cards/props).
      - name: Build high-confidence board
        working-directory: python
        run: python high_confidence_board.py || echo "high_confidence_board.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Build props-only parlays
        working-directory: python
        run: python props_parlay_builder.py || echo "props_parlay_builder.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Regression guard: prove the board's two real-outcome guards are live --
      # curation drops market families proven to lose money, empirical calibration
      # blends probs toward realized hit rates, and zero proven-negative plays
      # shipped. Fails the build if a guard regresses.
      - name: Verify calibration guards
        working-directory: python
        run: python verify_calibration.py || echo "verify_calibration.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Publish the model calibration map (predicted vs realized per market family,
      # the curation + calibration evidence) -> data/calibration_map.json ->
      # calibration-map.html. Show-your-work transparency from the settled ledger.
      - name: Build model calibration map
        working-directory: python
        run: python calibration_map.py || echo "calibration_map.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Real overall reliability diagram (Brier/ECE/buckets) from settled outcomes,
      # overwriting the old synthetic demo -> data/calibration.json (ML Lab chart).
      - name: Build real calibration report
        working-directory: python
        run: python calibration_real.py || echo "calibration_real.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Build parlay suggestions from today's qualifying single-leg edges.
      - name: Run parlay engine
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python parlays.py || echo "parlays.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Correlation-aware Same-Game Parlay (SGP) builder. For each game,
      # finds top-EV 2-4 leg combos using a pairwise correlation matrix
      # (e.g. same-player HR + TB are tightly coupled). Books charge ~25%
      # extra on SGPs assuming legs are independent -- this surfaces the
      # gap. Output: data/sgps.json -> /parlays.html top card.
      - name: Build correlation-aware Same-Game Parlays
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python sgp_builder.py || echo "sgp_builder.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Pitcher fatigue + early-hook risk grade. Powers /mlb panel.
      - name: Grade pitcher fatigue + early-hook risk
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python pitcher_fatigue.py || echo "pitcher_fatigue.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Weather-conditional HR-rate delta + OVER/UNDER lean per game.
      - name: Score weather-conditional HR multiplier
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python weather_conditional.py || echo "weather_conditional.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Pre-game slate confidence (lineup confirms / weather / rookies / hooks).
      # MUST run after pitcher_fatigue + weather_conditional so it sees them.
      - name: Compute pre-game slate confidence
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python slate_confidence.py || echo "slate_confidence.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Lineup churn watcher: diff matchups.json vs prior snapshot.
      # Runs in the live workflow too so churn surfaces between cron cycles.
      - name: Detect lineup churn (post-publish scratches)
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python lineup_churn.py || echo "lineup_churn.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Composite Best Bets ranker: rolls up DK + PP + NRFI + SGPs into
      # a single quality-scored list. Runs LAST so it sees the latest
      # of every upstream artifact. Powers /best-bets.html.
      - name: Compose Best Bets digest (composite ranker)
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python best_bets.py || echo "best_bets.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # PrizePicks Value Board: scans the PP slate for legs whose CALIBRATED hit
      # rate clears PrizePicks' flat-payout break-even. Overconfident families
      # dropped, uncalibrated props excluded -> data/prizepicks_value.json.
      - name: Build PrizePicks value board
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python prizepicks_value.py || echo "prizepicks_value.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Bullpen exhaustion -> late-inning OU lean per game.
      - name: Score bullpen workload alerts
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python bullpen_alert.py || echo "bullpen_alert.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Risk-adjusted Sharpe ranking of tonight's plays.
      - name: Rank by Sharpe (EV / sigma)
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python sharpe_ranking.py || echo "sharpe_ranking.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Auto-portfolio: optimal multi-bet subset given bankroll + Kelly +
      # slate-confidence-adjusted quality gate + per-game correlation cap.
      - name: Build auto-portfolio
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python portfolio_optimizer.py || echo "portfolio_optimizer.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # 10K MC simulator of tonight's portfolio outcomes. Powers /bankroll
      # "Tonight's Portfolio" card with real-money distribution.
      - name: Monte Carlo tonight's portfolio
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python bankroll_simulator.py || echo "bankroll_simulator.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Line movement / bet-timing: ACT NOW vs WAIT alerts from price
      # diffs cycle-over-cycle. Surfaces on /props.
      - name: Detect line-movement timing signals
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python line_timing.py || echo "line_timing.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Per-bet CLV tracker -- proves bets beat the close (sharpness proxy).
      - name: Compute per-bet CLV
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python clv_per_bet.py || echo "clv_per_bet.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Day-of-week P&L analysis from settled track_record.
      - name: Day-of-week performance analysis
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python dow_pl.py || echo "dow_pl.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Hot-streak heatmap for tonight's slate.
      - name: Score hot streaks (cross-slate heatmap)
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python hot_streaks.py || echo "hot_streaks.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Cross-book arb / shading detector (DK vs PrizePicks).
      - name: Detect cross-book arb opportunities
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python cross_book_arb.py || echo "cross_book_arb.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Pitcher fastball velocity decay flag (injury proxy).
      - name: Flag pitcher velocity decay
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python velocity_decay.py || echo "velocity_decay.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # Daily picks CSV export.
      - name: Export picks CSV
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python csv_export.py || echo "csv_export.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # NBA + NFL stubs (will start producing real data when enabled in config)
      - name: NBA stub artifact (back-compat)
        if: github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: python
        run: python nba_stub.py || echo "nba_stub.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # === DEEP DATA LAYER FIRST (so sport pipelines pick up fresh calibration shifts) ===
      # Self-training writes self_training_<sport>.json with bias corrections;
      # nba/nhl/wnba/etc pipelines read it via _self_training_shift() and apply
      # the shift to p_home_win. So this must run BEFORE the sport pipelines.
      - name: Pull last-14-days historical games per sport
        working-directory: python
        run: python historical_games.py || echo "historical_games.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Compute per-team form (L5/L10) per sport
        working-directory: python
        run: python multi_sport_team_form.py || echo "multi_sport_team_form.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Compute head-to-head history per sport
        working-directory: python
        run: python head_to_head.py || echo "head_to_head.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Self-training backtest (per-sport bias + calibration shift)
        working-directory: python
        run: python self_train.py || echo "self_train.py" >> "$RUNNER_TEMP/failed_steps.txt"
      # NOW run sport pipelines so they apply the freshly-computed calibration shifts
      - name: NBA live scoreboard + win probabilities (post-self-train)
        working-directory: python
        run: python nba_pipeline.py || echo "nba_pipeline.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: NHL live scoreboard + win probabilities (post-self-train)
        working-directory: python
        run: python nhl_pipeline.py || echo "nhl_pipeline.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Pull ESPN team rosters (NBA/WNBA/NHL/NFL) -- 4,618 players
        working-directory: python
        run: python espn_rosters.py || echo "espn_rosters.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Pull per-player game logs (last 20 games) for NBA/WNBA/NHL starters
        working-directory: python
        run: python espn_player_stats.py || echo "espn_player_stats.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Generate REAL player prop projections from per-game averages
        working-directory: python
        run: python real_player_props.py || echo "real_player_props.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Per-team residual analysis (over/underrated)
        working-directory: python
        run: python team_residuals.py || echo "team_residuals.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Player trends L5 vs L20 (heating up / cooling down)
        working-directory: python
        run: python player_trends.py || echo "player_trends.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Multi-sport portfolio builder (quality-weighted)
        working-directory: python
        run: python multi_sport_portfolio.py || echo "multi_sport_portfolio.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Drift detector v2 (prob shifts + model degradation)
        working-directory: python
        run: python drift_detector_v2.py || echo "drift_detector_v2.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Cross-sport CLV tracker (morning snapshot + intraday compare)
        working-directory: python
        run: python clv_tracker_multi.py || echo "clv_tracker_multi.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Heat/cold alert aggregator (hot teams + trending players)
        working-directory: python
        run: python heat_cold_alerts.py || echo "heat_cold_alerts.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: Pre-game alert system (form-aligned high conviction picks)
        working-directory: python
        run: python pregame_alerts.py || echo "pregame_alerts.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: MLB batter per-game logs (real prop projections for 372+ hitters)
        working-directory: python
        run: python mlb_batter_logs.py || echo "mlb_batter_logs.py" >> "$RUNNER_TEMP/failed_steps.txt"
      - name: MLB batter heat tracker (L14 AVG vs season delta)
        working-directory: python
        run: python mlb_batter_heat.py || echo "mlb_batter_heat.py" >> "$RUNNER_TEMP/failed_steps.txt"
