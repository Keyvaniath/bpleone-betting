name: Golf Live Tournament Poll

# PGA Tour rounds Thursday-Sunday, typically 12:00-23:30 UTC.
# Poll every 20 min during that window to keep leaderboard + win probabilities
# fresh. Cheap operation (single ESPN scoreboard call + 5K Monte Carlo, ~3s
# total). golf_state.json + golf_props.json get republished to GitHub Pages.

on:
  schedule:
    # Every 20 min, 12-23 UTC, Thu-Sun (most PGA play happens in this window)
    - cron: '*/20 12-23 * * 4,5,6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  golf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r python/requirements.txt

      # Pull active PGA tournament leaderboard from ESPN scoreboard.
      - name: Pull PGA Tour leaderboard
        working-directory: python
        run: python golf_pipeline.py

      # Re-run Monte Carlo (5K sims) using freshest leaderboard data.
      - name: Recompute golf win probabilities
        working-directory: python
        run: python golf_winner_model.py

      - name: Commit if state changed
        run: |
          git config user.name  "edgestat-bot"
          git config user.email "actions@github.com"
          git add data/golf_state.json data/golf_props.json
          if git diff --cached --quiet; then
            echo "No golf state change."
          else
            git commit -m "live(golf): poll $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git fetch origin main
              if git merge-base --is-ancestor origin/main HEAD; then
                git push && { echo "pushed cleanly"; exit 0; }
                sleep 3; continue
              fi
              if git rebase origin/main; then
                git push && { echo "pushed after rebase"; exit 0; }
              else
                git checkout --ours data/ 2>/dev/null || true
                git add data/
                git rebase --continue || git rebase --abort
                git push && { echo "pushed after conflict resolution"; exit 0; }
              fi
              sleep 5
            done
            echo "push failed after 3 retries"
            exit 1
          fi

      - name: Notify on golf-poll failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"content\": \"⚠️ EdgeStat golf-poll failed at $(date -u +%FT%TZ). Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi
