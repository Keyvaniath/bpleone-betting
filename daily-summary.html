<script>
// Tiny markdown to HTML converter — handles ## headings, lists, bold, code
function mdToHtml(md) {
  const lines = md.split("\n");
  let html = "";
  let inList = false;
  for (let line of lines) {
    if (line.startsWith("# ")) {
      if (inList) { html += "</ul>"; inList = false; }
      html += `<h1>${line.slice(2)}</h1>`;
    } else if (line.startsWith("## ")) {
      if (inList) { html += "</ul>"; inList = false; }
      html += `<h2>${line.slice(3)}</h2>`;
    } else if (line.startsWith("### ")) {
      if (inList) { html += "</ul>"; inList = false; }
      html += `<h3>${line.slice(4)}</h3>`;
    } else if (line.startsWith("- ") || line.startsWith("  - ")) {
      if (!inList) { html += "<ul>"; inList = true; }
      let item = line.replace(/^(\s*)- /, "");
      // Bold + code
      item = item.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      item = item.replace(/`([^`]+)`/g, "<code>$1</code>");
      html += `<li>${item}</li>`;
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      let p = line.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                   .replace(/`([^`]+)`/g, "<code>$1</code>");
      if (p.trim()) html += `<p>${p}</p>`;
    }
  }
  if (inList) html += "</ul>";
  return html;
}

fetch("data/daily_summary_v2.md?t=" + Date.now(), { cache: "no-cache" })
  .then(r => r.text())
  .then(md => {
    document.getElementById("content").innerHTML = mdToHtml(md);
    const date = (md.match(/# EdgeStat Daily Summary — (\S+)/) || [])[1];
    document.getElementById("status").textContent = `Brief generated ${date || 'today'} · ${md.length} chars · ${(md.match(/\n## /g) || []).length} sections`;
    document.getElementById("meta").textContent = `${(md.match(/\n## /g) || []).length} sections`;
  })
  .catch(err => {
    document.getElementById("content").innerHTML = `<p class="muted">Could not load daily_summary_v2.md (${err.message}).</p>`;
  });
</script>
